  if(polygonPoints.length){ drawPolygonPreview(pos); return; }
  if(freeformPoints.length){ drawFreeformPreview(pos); return; }
  if(state.tool==='bezier' && bezierNodes.length){ drawBezierOverlay(pos); return; }
  if(['select','lasso','wand'].includes(state.tool)){ drawSelectionOverlay(); return; }
  overlayCtx.clearRect(0,0,DOC.w,DOC.h);
  drawGridAndGuides();
  drawBrushCursor(pos);
}
function pickColorAt(pos){
  composite();
  const d=mainCtx.getImageData(clamp(Math.floor(pos.x),0,DOC.w-1),clamp(Math.floor(pos.y),0,DOC.h-1),1,1).data;
  const hex='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');
  const hsv=rgbToHsv(d[0],d[1],d[2]);
  state.hue=hsv.h; state.sat=hsv.s; state.val=hsv.v;
  hueSlider.value=state.hue; drawSvCanvas(); commitColor();
  toast('Color tomado: '+hex);
}

overlayCanvas.addEventListener('pointerdown',(e)=>{
  const posEarly=getPos(e);
  if(state.tool==='heal' && e.altKey){
    healSource={x:posEarly.x,y:posEarly.y}; healOffset=null;
    toast('Origen fijado — ahora pinta sobre la imperfección');
    updateOverlayHover(posEarly);
    e.preventDefault(); return;
  }
  if(e.altKey && refImage && refImage.visible && state.tool!=='heal'){
    isDraggingRef=true;
    refDragStart={mx:posEarly.x, my:posEarly.y, rx:refImage.x, ry:refImage.y};
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
    e.preventDefault();
    return;
  }
  if(spaceHeld || state.tool==='hand'){
    panState={startX:e.clientX,startY:e.clientY,scrollL:canvasArea.scrollLeft,scrollT:canvasArea.scrollTop};
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
    return;
  }
  if(state.tool==='image'){
    if(!floatingImg){ pickImageFile(startImageTransform); e.preventDefault(); return; }
    const hit=hitTestImageHandle(posEarly);
    let mode=hit?hit.mode:null;
    if(!mode){
      const local=toLocalImg(posEarly);
      if(Math.abs(local.x)<=floatingImg.w/2 && Math.abs(local.y)<=floatingImg.h/2) mode='move';
    }
    if(mode){
      imgDrag={mode, handle:hit?hit.handle:null, startMouse:posEarly,
        orig:{x:floatingImg.x,y:floatingImg.y,w:floatingImg.w,h:floatingImg.h,angle:floatingImg.angle},
        center:imgCenter()};
      try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
    }
    e.preventDefault();
    return;
  }
  if(layers[activeLayerIndex].locked && state.tool!=='eyedropper' && state.tool!=='select'){ toast('Esta capa está bloqueada'); return; }
  const pos=getPos(e);
  const tool=state.tool;
  if(tool==='brush'||tool==='pencil'||tool==='eraser'){
    pushUndo(); isStrokeActive=true;
    if(state.wetBrush && tool!=='eraser'){
      wetCanvas=document.createElement('canvas'); wetCanvas.width=DOC.w; wetCanvas.height=DOC.h;
      wetCtx=wetCanvas.getContext('2d');
    } else { wetCanvas=null; wetCtx=null; }
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
    stabPos={x:pos.x,y:pos.y};
    strokeBranches=getSymmetryBranches().map(fn=>({transform:fn, lastPoint:fn(pos), lastMid:fn(pos), smoothed:null}));
    strokeBranches.forEach(b=>drawDotOnLayer(b.lastPoint,pos.pressure));
    scheduleComposite();
  } else if(tool==='spray'){
    pushUndo(); isStrokeActive=true; sprayPos=pos;
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
    sprayDab();
    sprayTimer=setInterval(sprayDab,45);
  } else if(tool==='smudge'){
    pushUndo(); isStrokeActive=true; smudgeLast=pos;
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
  } else if(tool==='liquify'){
    pushUndo(); isStrokeActive=true; smudgeLast=pos;
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
  } else if(tool==='dodge'){
    pushUndo(); isStrokeActive=true; smudgeLast=pos; dodgeInvert=e.altKey;
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
    dodgeBurnDab(pos.x,pos.y,dodgeInvert); scheduleComposite();
  } else if(tool==='heal'){
    if(!healSource){ toast('Primero mantén Alt y haz clic en una zona limpia para elegir el origen'); return; }
    pushUndo(); isStrokeActive=true; smudgeLast=pos;
    healOffset={x:healSource.x-pos.x,y:healSource.y-pos.y};
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
    healDab(pos.x,pos.y); scheduleComposite();
  } else if(tool==='bezier'){
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
    bzDown(pos,e);
  } else if(SHAPE_TOOLS.includes(tool)){
    pushUndo(); isStrokeActive=true; shapeStart=snapToGuides(pos);
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
  } else if(tool==='gradient'){
    isStrokeActive=true; gradientStart=snapToGuides(pos);
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
  } else if(tool==='select'){
    isStrokeActive=true; shapeStart=snapToGuides(pos);
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
  } else if(tool==='lasso'){
    isStrokeActive=true; lassoPoints=[pos];
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
  } else if(tool==='wand'){
    state.selection=makeMagicWandSelection(pos.x,pos.y,state.tolerance);
    drawSelectionOverlay();
    if(!state.selection) toast('No se encontró una región para seleccionar ahí');
  } else if(tool==='freeform'){
    if(freeformPoints.length===0) pushUndo();
    // Si está cerca del primer vértice y ya hay ≥3 puntos → cerrar
    if(ffSnapToFirst(pos)){
      finalizeFreeform();
    } else {
      freeformPoints.push(pos);
      drawFreeformPreview(pos);
    }
  } else if(tool==='polygon'){
    if(polygonPoints.length===0) pushUndo();
    polygonPoints.push(pos);
    drawPolygonPreview(pos);
  } else if(tool==='fill'){
    pushUndo(); floodFill(layers[activeLayerIndex].ctx,pos.x,pos.y,state.color,state.tolerance);
    composite(); updateActiveThumbnail(); addRecentColor(state.color);
  } else if(tool==='eyedropper'){
    pickColorAt(pos);
  } else if(tool==='text'){
    openTextEditor(pos);
  } else if(tool==='move'){
    pushUndo(); isStrokeActive=true; moveStart=pos;
    const layer=layers[activeLayerIndex];
    tempMoveCanvas=document.createElement('canvas'); tempMoveCanvas.width=DOC.w; tempMoveCanvas.height=DOC.h;
    tempMoveCanvas.getContext('2d').drawImage(layer.canvas,0,0);
    try{overlayCanvas.setPointerCapture(e.pointerId);}catch(err){}
  }
});

overlayCanvas.addEventListener('pointermove',(e)=>{
  const pos=getPos(e);
  updateStatusBarCoords(pos);
  const tool=state.tool;
  if(isDraggingRef && refImage && refDragStart){
    refImage.x=refDragStart.rx+(pos.x-refDragStart.mx);
    refImage.y=refDragStart.ry+(pos.y-refDragStart.my);
    scheduleComposite();
    return;
  }
  if(panState){
    canvasArea.scrollLeft=panState.scrollL-(e.clientX-panState.startX);
    canvasArea.scrollTop=panState.scrollT-(e.clientY-panState.startY);
    return;
  }
  if(tool==='image'){
    if(imgDrag) applyImageDrag(pos, e.shiftKey);
    return;
  }
  if(tool==='bezier'){ bzMove(pos,e); return; }
  if(isStrokeActive && tool==='dodge'){
    dodgeBurnStep(smudgeLast,pos,dodgeInvert);
    smudgeLast=pos; scheduleComposite(); redrawOverlayWhileDrawing(pos);
    return;
  }
  if(isStrokeActive && tool==='heal'){
    healStep(smudgeLast,pos);
    smudgeLast=pos; scheduleComposite(); redrawOverlayWhileDrawing(pos);
    return;
  }
  if(isStrokeActive && tool==='liquify'){
    liquifyStep(smudgeLast,pos);
    smudgeLast=pos;
    scheduleComposite();
    redrawOverlayWhileDrawing(pos);
    return;
  }
  if(isStrokeActive && (tool==='brush'||tool==='pencil'||tool==='eraser')){
    let spos=pos;
    if(state.stabilizer>0 && stabPos){
      const L=state.stabilizer*1.2;
      const dx=pos.x-stabPos.x, dy=pos.y-stabPos.y, dd=Math.hypot(dx,dy);
      if(dd>L){ const f=(dd-L)/dd; stabPos={x:stabPos.x+dx*f,y:stabPos.y+dy*f}; }
      spos={x:stabPos.x,y:stabPos.y,pressure:pos.pressure};
    }
    strokeBranches.forEach(b=>{
      const raw=b.transform(spos);
      const smoothed=smoothPoint(b,raw);
      const mid=midpoint(b.lastPoint,smoothed);
      strokeSegmentOnLayer(b.lastMid,b.lastPoint,mid,pos.pressure);
      b.lastMid=mid; b.lastPoint=smoothed;
    });
    scheduleComposite();
    redrawOverlayWhileDrawing(pos);
    if(state.stabilizer>0){
      overlayCtx.save(); overlayCtx.strokeStyle='rgba(226,163,77,.9)'; overlayCtx.lineWidth=1.5; overlayCtx.setLineDash([4,3]);
      overlayCtx.beginPath(); overlayCtx.moveTo(spos.x,spos.y); overlayCtx.lineTo(pos.x,pos.y); overlayCtx.stroke(); overlayCtx.restore();
    }
  } else if(isStrokeActive && tool==='spray'){
    sprayPos=pos;
    redrawOverlayWhileDrawing(pos);
  } else if(isStrokeActive && tool==='smudge'){
    smudgeStep(smudgeLast,pos);
    smudgeLast=pos;
    scheduleComposite();
    redrawOverlayWhileDrawing(pos);
  } else if(tool==='freeform' && freeformPoints.length){
    drawFreeformPreview(pos);
  } else if(isStrokeActive && SHAPE_TOOLS.includes(tool)){
    let end=e.shiftKey?constrainShape(tool,shapeStart,pos):snapToGuides(pos);
    overlayCtx.clearRect(0,0,DOC.w,DOC.h);
    drawGridAndGuides();
    renderShape(overlayCtx,tool,shapeStart,end,currentStyle());
    pendingShapeEnd=end;
  } else if(isStrokeActive && tool==='gradient'){
    const end=e.shiftKey?constrainShape('line',gradientStart,pos):snapToGuides(pos);
    overlayCtx.clearRect(0,0,DOC.w,DOC.h);
    drawGridAndGuides();
    overlayCtx.save();
    overlayCtx.strokeStyle='rgba(255,255,255,.9)'; overlayCtx.lineWidth=2; overlayCtx.setLineDash([6,4]);
    overlayCtx.beginPath(); overlayCtx.moveTo(gradientStart.x,gradientStart.y); overlayCtx.lineTo(end.x,end.y); overlayCtx.stroke();
    overlayCtx.setLineDash([]);
    overlayCtx.fillStyle=state.color;
    overlayCtx.beginPath(); overlayCtx.arc(gradientStart.x,gradientStart.y,5,0,Math.PI*2); overlayCtx.fill();
    overlayCtx.fillStyle=state.gradientFade?'rgba(255,255,255,.15)':state.gradientColor2;
    overlayCtx.beginPath(); overlayCtx.arc(end.x,end.y,5,0,Math.PI*2); overlayCtx.fill();
    overlayCtx.strokeStyle='rgba(0,0,0,.6)'; overlayCtx.lineWidth=1;
    overlayCtx.stroke();
    overlayCtx.restore();
    pendingShapeEnd=end;
  } else if(isStrokeActive && tool==='select'){
    let end=pos;
    if(e.shiftKey){
      const d=Math.max(Math.abs(pos.x-shapeStart.x),Math.abs(pos.y-shapeStart.y));
      end={x:shapeStart.x+(pos.x<shapeStart.x?-d:d), y:shapeStart.y+(pos.y<shapeStart.y?-d:d)};
    }
    pendingShapeEnd=end;
    overlayCtx.clearRect(0,0,DOC.w,DOC.h);
    drawGridAndGuides();
    overlayCtx.save();
    overlayCtx.strokeStyle='rgba(255,255,255,.9)'; overlayCtx.lineWidth=1.4; overlayCtx.setLineDash([7,5]);
    const rx=Math.min(shapeStart.x,end.x), ry=Math.min(shapeStart.y,end.y), rw=Math.abs(end.x-shapeStart.x), rh=Math.abs(end.y-shapeStart.y);
    overlayCtx.strokeRect(rx,ry,rw,rh);
    overlayCtx.restore();
  } else if(isStrokeActive && tool==='lasso'){
    const last=lassoPoints[lassoPoints.length-1];
    if(!last || Math.hypot(pos.x-last.x,pos.y-last.y)>=2/state.zoom) lassoPoints.push(pos);
    overlayCtx.clearRect(0,0,DOC.w,DOC.h);
    drawGridAndGuides();
    overlayCtx.save();
    overlayCtx.strokeStyle='rgba(255,255,255,.9)'; overlayCtx.lineWidth=1.4; overlayCtx.setLineDash([5,4]);
    overlayCtx.beginPath();
    overlayCtx.moveTo(lassoPoints[0].x,lassoPoints[0].y);
    for(let i=1;i<lassoPoints.length;i++) overlayCtx.lineTo(lassoPoints[i].x,lassoPoints[i].y);
    overlayCtx.lineTo(pos.x,pos.y);
    overlayCtx.stroke();
    overlayCtx.restore();
  } else if(isStrokeActive && tool==='move'){
    const dx=pos.x-moveStart.x, dy=pos.y-moveStart.y;
    const layer=layers[activeLayerIndex];
    layer.ctx.clearRect(0,0,DOC.w,DOC.h);
    layer.ctx.drawImage(tempMoveCanvas,dx,dy);
    scheduleComposite();
  } else {
    updateOverlayHover(pos);
  }
});

window.addEventListener('pointerup',(e)=>{
  if(isDraggingRef){ isDraggingRef=false; refDragStart=null; composite(); return; }
  if(panState){ panState=null; return; }
  if(state.tool==='image'){ imgDrag=null; return; }
  if(state.tool==='bezier'){ bzUp(); return; }
  if(!isStrokeActive) return;
  isStrokeActive=false;
  const tool=state.tool;
  if(tool==='brush'||tool==='pencil'||tool==='eraser'){
    strokeBranches=null;
    if(wetCanvas && tool!=='eraser'){
      const layer=layers[activeLayerIndex];
      layer.ctx.save(); layer.ctx.globalAlpha=state.opacity; layer.ctx.globalCompositeOperation='source-over';
      layer.ctx.drawImage(wetCanvas,0,0); layer.ctx.restore();
      wetCanvas=null; wetCtx=null;
    }
    composite(); updateActiveThumbnail(); addRecentColor(state.color);
  } else if(tool==='spray'){
    if(sprayTimer){ clearInterval(sprayTimer); sprayTimer=null; }
    sprayPos=null; composite(); updateActiveThumbnail(); addRecentColor(state.color);
  } else if(tool==='smudge'){
    smudgeLast=null; composite(); updateActiveThumbnail();
  } else if(tool==='liquify'){
    smudgeLast=null; composite(); updateActiveThumbnail();
  } else if(tool==='dodge'){
    smudgeLast=null; composite(); updateActiveThumbnail();
  } else if(tool==='heal'){
    smudgeLast=null; healOffset=null; composite(); updateActiveThumbnail();
  } else if(SHAPE_TOOLS.includes(tool)){
    if(pendingShapeEnd) renderShape(layers[activeLayerIndex].ctx,tool,shapeStart,pendingShapeEnd,currentStyle());
    overlayCtx.clearRect(0,0,DOC.w,DOC.h); pendingShapeEnd=null; shapeStart=null;
    composite(); updateActiveThumbnail(); addRecentColor(state.color);
  } else if(tool==='gradient'){
    if(pendingShapeEnd && gradientStart) applyGradient(gradientStart,pendingShapeEnd);
    overlayCtx.clearRect(0,0,DOC.w,DOC.h); pendingShapeEnd=null; gradientStart=null;
    drawStaticOverlay();
  } else if(tool==='select'){
    if(shapeStart && pendingShapeEnd){
      const rx=Math.min(shapeStart.x,pendingShapeEnd.x), ry=Math.min(shapeStart.y,pendingShapeEnd.y);
      const rw=Math.abs(pendingShapeEnd.x-shapeStart.x), rh=Math.abs(pendingShapeEnd.y-shapeStart.y);
      state.selection=(rw>=2&&rh>=2)?makeRectSelection(rx,ry,rw,rh):null;
    }
    shapeStart=null; pendingShapeEnd=null;
    drawSelectionOverlay();
  } else if(tool==='lasso'){
    state.selection=makeLassoSelection(lassoPoints);
    lassoPoints=[];
    drawSelectionOverlay();
  } else if(tool==='move'){
    tempMoveCanvas=null; composite(); updateActiveThumbnail();
  }
});
overlayCanvas.addEventListener('pointerleave',()=>{
  if(!isStrokeActive && !['select','lasso','wand','image'].includes(state.tool) && !(state.tool==='bezier'&&bezierNodes.length) && !(state.tool==='freeform'&&freeformPoints.length)){ overlayCtx.clearRect(0,0,DOC.w,DOC.h); }
  if(sprayTimer && state.tool!=='spray'){ clearInterval(sprayTimer); sprayTimer=null; }
});
overlayCanvas.addEventListener('dblclick',()=>{
  if(state.tool==='polygon') finalizePolygon();
  if(state.tool==='freeform') finalizeFreeform();
  if(state.tool==='bezier' && bezierNodes.length>=2){ bezierDrag=null; commitBezier(false); }
});

document.addEventListener('keydown',(e)=>{
  if(e.target && (e.target.isContentEditable || e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA')) return;
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); if(e.shiftKey) redo(); else undo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); saveProject(); return; }
  if((e.ctrlKey||e.metaKey) && (e.key==='='||e.key==='+')){ e.preventDefault(); applyZoom(state.zoom*1.2); return; }
  if((e.ctrlKey||e.metaKey) && e.key==='-'){ e.preventDefault(); applyZoom(state.zoom/1.2); return; }
  if((e.ctrlKey||e.metaKey) && e.key==='0'){ e.preventDefault(); fitToScreen(); return; }
  if(state.tool==='image' && floatingImg){
    if(e.key==='Enter'){ e.preventDefault(); commitImageTransform(); return; }
    if(e.key==='Escape'){ e.preventDefault(); cancelImageTransform(); return; }
  }
  if(state.tool==='bezier' && bezierNodes.length){
    if(e.key==='Enter'){ e.preventDefault(); commitBezier(false); return; }
    if(e.key==='Escape'){ e.preventDefault(); cancelBezier(); return; }
    if(e.key==='Backspace'||e.key==='Delete'){ e.preventDefault(); bezierNodes.pop(); drawBezierOverlay(bezierHover); return; }
  }
  if(state.tool==='freeform' && freeformPoints.length){
    if(e.key==='Enter'){ e.preventDefault(); finalizeFreeform(); return; }
    if(e.key==='Escape'){ freeformPoints=[]; overlayCtx.clearRect(0,0,DOC.w,DOC.h); return; }
  }
  if(e.key==='Escape' && polygonPoints.length){ polygonPoints=[]; overlayCtx.clearRect(0,0,DOC.w,DOC.h); return; }
  if(e.key==='Escape' && state.selection){ deselectAll(); return; }
  if((e.key==='Delete'||e.key==='Backspace') && state.selection && ['select','lasso','wand'].includes(state.tool)){ e.preventDefault(); clearSelectionContents(); return; }
  if(e.key==='['){ state.size=Math.max(1,state.size-4); buildOptionsPanel(); updateOptionsPanel(); saveUserSettings(); return; }
  if(e.key===']'){ state.size=state.size+4; buildOptionsPanel(); updateOptionsPanel(); saveUserSettings(); return; }
  if(e.code==='Space' && !spaceHeld){ spaceHeld=true; overlayCanvas.classList.add('cursor-grab'); e.preventDefault(); return; }
  if(/^[1-9]$/.test(e.key) && ['brush','pencil','eraser','spray','smudge','liquify','freeform'].includes(state.tool)){
    state.size=SIZE_PRESETS[parseInt(e.key)-1];
    buildOptionsPanel(); updateOptionsPanel();
    toast('Tamaño: '+state.size+'px');
    saveUserSettings();
    return;
  }
  const map={b:'brush',p:'pencil',u:'spray',d:'smudge',e:'eraser',l:'line',r:'rect',j:'roundrect',c:'ellipse',n:'triangle',k:'star',g:'polygon',x:'freeform',z:'dodge',a:'arrow',y:'gradient',s:'select',q:'lasso',w:'wand',f:'fill',i:'eyedropper',t:'text',v:'move',h:'hand',m:'image',o:'liquify'};
  const k=e.key.toLowerCase();
  if(e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey){ const sm={b:'bezier',z:'heal'}; if(sm[k]){ selectTool(sm[k]); return; } }
  if(map[k]){ selectTool(map[k]); }
});
document.addEventListener('keyup',(e)=>{
  if(e.code==='Space'){ spaceHeld=false; overlayCanvas.classList.remove('cursor-grab'); updateCanvasCursorClass(); }
});

/* ===================== GUARDAR / ABRIR / EXPORTAR ===================== */
function saveProject(){
  try{
    const data={
      w:DOC.w, h:DOC.h,
      layers:layers.map(l=>({name:l.name,visible:l.visible,opacity:l.opacity,blend:l.blend,locked:l.locked,clip:!!l.clip,data:l.canvas.toDataURL('image/png')}))
    };
    localStorage.setItem('suavelienzo_proyecto', JSON.stringify(data));
    toast('Proyecto guardado en este navegador');
  }catch(err){ toast('No se pudo guardar (lienzo muy grande para el almacenamiento local)'); }
}
function loadProject(){
  const raw=localStorage.getItem('suavelienzo_proyecto');
  if(!raw){ toast('No hay ningún proyecto guardado todavía'); return; }
  const data=JSON.parse(raw);
  DOC.w=data.w; DOC.h=data.h;
  mainCanvas.width=overlayCanvas.width=DOC.w;
  mainCanvas.height=overlayCanvas.height=DOC.h;
  const promises=data.layers.map(ld=>new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=DOC.w; c.height=DOC.h;
      const ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
      res({id:layerIdSeq++, name:ld.name, canvas:c, ctx, visible:ld.visible, opacity:ld.opacity, blend:ld.blend, locked:ld.locked, clip:!!ld.clip});
    };
    img.src=ld.data;
  }));
  Promise.all(promises).then(newLayers=>{
    layers=newLayers; activeLayerIndex=layers.length-1;
    undoStack=[]; redoStack=[]; updateHistoryButtons();
    applyZoom(state.zoom); composite(); renderLayerList(); updateStatDoc();
    toast('Proyecto cargado');
  });
}
/* ===================== EXPORTAR (multi-resolución) ===================== */
const EXPORT_PRESETS=[
  {id:'original', label:'Original', longSide:0, mult:1, premium:false},
  {id:'2x', label:'2×', longSide:0, mult:2, premium:false},
  {id:'4x', label:'4×', longSide:0, mult:4, premium:true},
  {id:'4k', label:'4K', longSide:3840, mult:0, premium:true},
  {id:'8k', label:'8K', longSide:7680, mult:0, premium:true},
  {id:'16k', label:'16K', longSide:15360, mult:0, premium:true},
  {id:'30k', label:'30K', longSide:30000, mult:0, premium:true}
];
function calcExportSize(preset){
  if(preset.mult && preset.mult>1) return {w:Math.round(DOC.w*preset.mult), h:Math.round(DOC.h*preset.mult), scale:preset.mult};
  if(!preset.longSide || preset.longSide<=0) return {w:DOC.w, h:DOC.h, scale:1};
  const currentLong=Math.max(DOC.w,DOC.h);
  const scale=preset.longSide/currentLong;
  return {w:Math.round(DOC.w*scale), h:Math.round(DOC.h*scale), scale};
}
function upscaleHQ(src,targetW,targetH){
  if(src.width===targetW && src.height===targetH) return src;
  let cur=src, cw=src.width, ch=src.height;
  while(cw*2<targetW || ch*2<targetH){
    const nw=Math.min(targetW,Math.round(cw*2));
    const nh=Math.min(targetH,Math.round(ch*(nw/cw)));
    const tmp=document.createElement('canvas'); tmp.width=nw; tmp.height=nh;
    const ctx=tmp.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(cur,0,0,nw,nh);
    cur=tmp; cw=nw; ch=nh;
  }
  if(cw!==targetW || ch!==targetH){
    const fin=document.createElement('canvas'); fin.width=targetW; fin.height=targetH;
    const ctx=fin.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
    ctx.drawImage(cur,0,0,targetW,targetH);
    return fin;
  }
  return cur;
}
function isBackgroundLayer(layer,index){ return index===0 && layer.name==='Fondo'; }
function doExportPng(transparent,presetId){
  const preset=EXPORT_PRESETS.find(p=>p.id===presetId)||EXPORT_PRESETS[0];
  const size=calcExportSize(preset);
  const maxPixels=100000000;
  if(size.w*size.h>maxPixels){ toast('Resolución demasiado grande para este navegador. Prueba una más baja.'); return; }
  toast('Generando '+preset.label+(transparent?' transparente':'')+' ('+size.w+'×'+size.h+')…');
  closeModal();
  requestAnimationFrame(()=>{
    try{
      const base=document.createElement('canvas'); base.width=DOC.w; base.height=DOC.h;
      const bctx=base.getContext('2d',{alpha:true});
      bctx.clearRect(0,0,DOC.w,DOC.h);
      if(!transparent){ bctx.fillStyle='#ffffff'; bctx.fillRect(0,0,DOC.w,DOC.h); }
      drawLayersTo(bctx,{skip:(layer,index)=>transparent && isBackgroundLayer(layer,index)});
      const out=(size.scale===1)?base:upscaleHQ(base,size.w,size.h);
      out.toBlob(blob=>{
        if(!blob){ toast('Error al generar la imagen'); return; }
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        const d=new Date();
        const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');
        const bgTag=transparent?'transparente':'fondo';
        a.href=url; a.download='UMBRA_PAINT-'+preset.label+'-'+bgTag+'-'+size.w+'x'+size.h+'-'+stamp+'.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
        toast(preset.label+' · '+(transparent?'sin fondo · ':'')+size.w+'×'+size.h+' · listo');
      },'image/png');
    }catch(err){
      console.error(err);
      toast('No se pudo exportar. Prueba una resolución más baja.');
    }
  });
}
function openExportModal(){
  let selectedPreset='original', transparent=false;
  modalRoot.innerHTML=
    '<div class="modal-overlay"><div class="modal-box">'+

      EXPORT_PRESETS.map(p=>'<button data-id="'+p.id+'"'+(p.id==='original'?' class="sel"':'')+'><b>'+p.label+'</b><span>'+(p.mult>1?('×'+p.mult):(p.longSide?p.longSide+'px lado mayor':DOC.w+'×'+DOC.h))+'</span></button>').join('')+

/* ===================== EXPORTAR CAPAS EN ZIP (sin dependencias externas) ===================== */
const CRC_TABLE=(()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++){ c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); } t[n]=c>>>0; }
  return t;
})();
function crc32(bytes){
  let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++){ c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8); }
  return (c^0xFFFFFFFF)>>>0;
}
function makeZip(files){
  const encoder=new TextEncoder();
  const localParts=[], centralParts=[];
  let offset=0;
  files.forEach(f=>{
    const nameBytes=encoder.encode(f.name);
    const data=f.data;
    const crc=crc32(data);
    const size=data.length;
    const local=new Uint8Array(30+nameBytes.length);
    const lv=new DataView(local.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0,true); lv.setUint16(8,0,true);
    lv.setUint16(10,0,true); lv.setUint16(12,0,true); lv.setUint32(14,crc,true);
    lv.setUint32(18,size,true); lv.setUint32(22,size,true); lv.setUint16(26,nameBytes.length,true); lv.setUint16(28,0,true);
    local.set(nameBytes,30);
    localParts.push(local, data);
    const central=new Uint8Array(46+nameBytes.length);
    const cv=new DataView(central.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true); cv.setUint16(8,0,true);
    cv.setUint16(10,0,true); cv.setUint16(12,0,true); cv.setUint16(14,0,true); cv.setUint32(16,crc,true);
    cv.setUint32(20,size,true); cv.setUint32(24,size,true); cv.setUint16(28,nameBytes.length,true);
    cv.setUint16(30,0,true); cv.setUint16(32,0,true); cv.setUint16(34,0,true); cv.setUint16(36,0,true);
    cv.setUint32(38,0,true); cv.setUint32(42,offset,true);
    central.set(nameBytes,46);
    centralParts.push(central);
    offset+=local.length+data.length;
  });
  const centralStart=offset;
  let centralSize=0; centralParts.forEach(c=>centralSize+=c.length);
  const end=new Uint8Array(22);
  const ev=new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(4,0,true); ev.setUint16(6,0,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,centralSize,true); ev.setUint32(16,centralStart,true); ev.setUint16(20,0,true);
  return new Blob([...localParts, ...centralParts, end], {type:'application/zip'});
}
function dataURLToBytes(dataURL){
  const base64=dataURL.split(',')[1];
  const bin=atob(base64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes;
}
function exportLayersZip(){
  toast('Generando ZIP con '+layers.length+' capa(s)…');
  requestAnimationFrame(()=>{
    try{
      const files=layers.map((layer,i)=>{
        const dataURL=layer.canvas.toDataURL('image/png');
        const safeName=layer.name.replace(/[^a-z0-9áéíóúñü _-]/gi,'').trim()||'capa';
        return {name:String(i+1).padStart(2,'0')+'-'+safeName+'.png', data:dataURLToBytes(dataURL)};
      });
      const blob=makeZip(files);
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      const d=new Date();
      const stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      a.href=url; a.download='UMBRA_PAINT-capas-'+stamp+'.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      toast('ZIP listo con '+files.length+' capa(s)');
    }catch(err){ console.error(err); toast('No se pudo generar el ZIP'); }
  });
}

function loadRefImageFromFile(file){
  if(!file || !file.type.startsWith('image/')){ toast('Selecciona una imagen válida'); return; }

/* ===================== INSERTAR IMAGEN Y TRANSFORMARLA ===================== */
/* A diferencia del boceto de referencia, esta imagen SÍ se aplica como una capa
   real y editable que se exporta con el resto del dibujo. Se puede mover, escalar
   y rotar con manijas antes de aplicarla. */
function startImageTransform(file){
  if(!file || !file.type.startsWith('image/')){ toast('Selecciona una imagen válida'); return; }
  const reader=new FileReader();
  reader.onload=(ev)=>{
    const img=new Image();
    img.onload=()=>{
      const fitScale=Math.min(DOC.w/img.width, DOC.h/img.height, 1);
      const w=img.width*fitScale, h=img.height*fitScale;
      floatingImg={img, x:(DOC.w-w)/2, y:(DOC.h-h)/2, w, h, angle:0, opacity:1};
      if(state.tool!=='image') selectTool('image'); else drawImageTransformOverlay();
      refreshImagePanel();
      toast('Mueve, escala (esquinas) o rota (tirador verde) · Enter aplica · Esc cancela');
    };
    img.onerror=()=>toast('No se pudo cargar la imagen');
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}
function imgCenter(){ return {x:floatingImg.x+floatingImg.w/2, y:floatingImg.y+floatingImg.h/2}; }
function rotVec(v,ang){ const c=Math.cos(ang), s=Math.sin(ang); return {x:v.x*c-v.y*s, y:v.x*s+v.y*c}; }
function toLocalImg(pos){
  const c=imgCenter();
  const d=rotVec({x:pos.x-c.x,y:pos.y-c.y}, -floatingImg.angle);
  return d;
}
function hitTestImageHandle(pos){
  const local=toLocalImg(pos);
  const hw=floatingImg.w/2, hh=floatingImg.h/2, thresh=16;
  const corners={tl:[-hw,-hh],tr:[hw,-hh],br:[hw,hh],bl:[-hw,hh]};
  for(const key in corners){
    const [cx,cy]=corners[key];
    if(Math.hypot(local.x-cx,local.y-cy)<=thresh) return {mode:'scale', handle:key};
  }
  const rotY=-hh-34;
  if(Math.hypot(local.x-0,local.y-rotY)<=thresh) return {mode:'rotate'};
  return null;
}
function drawImageTransformOverlay(){
  overlayCtx.clearRect(0,0,DOC.w,DOC.h);
  if(!floatingImg) return;
  const c=imgCenter(), hw=floatingImg.w/2, hh=floatingImg.h/2;
  const nn=mainCanvas.classList.contains('nearest-neighbor');
  overlayCtx.save();
  overlayCtx.imageSmoothingEnabled=!nn;
  overlayCtx.translate(c.x,c.y); overlayCtx.rotate(floatingImg.angle);
  overlayCtx.globalAlpha=floatingImg.opacity;
  overlayCtx.drawImage(floatingImg.img,-hw,-hh,floatingImg.w,floatingImg.h);
  overlayCtx.globalAlpha=1;
  overlayCtx.strokeStyle='rgba(226,163,77,.95)'; overlayCtx.lineWidth=1.6; overlayCtx.setLineDash([6,4]);
  overlayCtx.strokeRect(-hw,-hh,floatingImg.w,floatingImg.h);
  overlayCtx.setLineDash([]);
  const corners=[[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];
  overlayCtx.fillStyle='#e2a34d'; overlayCtx.strokeStyle='#141519'; overlayCtx.lineWidth=1.4;
  corners.forEach(([cx,cy])=>{ overlayCtx.beginPath(); overlayCtx.arc(cx,cy,IMG_HANDLE_R,0,Math.PI*2); overlayCtx.fill(); overlayCtx.stroke(); });
  const rotY=-hh-34;
  overlayCtx.beginPath(); overlayCtx.moveTo(0,-hh); overlayCtx.lineTo(0,rotY); overlayCtx.strokeStyle='rgba(226,163,77,.8)'; overlayCtx.stroke();
  overlayCtx.beginPath(); overlayCtx.arc(0,rotY,IMG_HANDLE_R,0,Math.PI*2); overlayCtx.fillStyle='#5cc28a'; overlayCtx.fill(); overlayCtx.stroke();
  overlayCtx.restore();
}
function applyImageDrag(pos,shift){
  if(!imgDrag || !floatingImg) return;
  if(imgDrag.mode==='move'){
    floatingImg.x=imgDrag.orig.x+(pos.x-imgDrag.startMouse.x);
    floatingImg.y=imgDrag.orig.y+(pos.y-imgDrag.startMouse.y);
  } else if(imgDrag.mode==='rotate'){
    const c=imgDrag.center;
    let ang=Math.atan2(pos.y-c.y,pos.x-c.x)+Math.PI/2;
    if(shift) ang=Math.round(ang/(Math.PI/12))*(Math.PI/12);
    floatingImg.angle=ang;
  } else if(imgDrag.mode==='scale'){
    const signMap={tl:[-1,-1],tr:[1,-1],br:[1,1],bl:[-1,1]};
    const [sx,sy]=signMap[imgDrag.handle];
    const angle0=imgDrag.orig.angle;
    const anchorLocal={x:-sx*imgDrag.orig.w/2, y:-sy*imgDrag.orig.h/2};
    const anchorRot=rotVec(anchorLocal,angle0);
    const anchorDoc={x:imgDrag.center.x+anchorRot.x, y:imgDrag.center.y+anchorRot.y};
    const vecLocal=rotVec({x:pos.x-anchorDoc.x,y:pos.y-anchorDoc.y}, -angle0);
    let newW=Math.max(12, sx*vecLocal.x), newH=Math.max(12, sy*vecLocal.y);
    if(!shift){
      const scale=((newW/imgDrag.orig.w)+(newH/imgDrag.orig.h))/2;
      newW=Math.max(12, imgDrag.orig.w*scale); newH=Math.max(12, imgDrag.orig.h*scale);
    }
    const handleRotNew=rotVec({x:sx*newW/2,y:sy*newH/2}, angle0);
    const newCenter={x:anchorDoc.x+handleRotNew.x, y:anchorDoc.y+handleRotNew.y};
    floatingImg.w=newW; floatingImg.h=newH;
    floatingImg.x=newCenter.x-newW/2; floatingImg.y=newCenter.y-newH/2;
  }
  drawImageTransformOverlay();
}
function commitImageTransform(){
  if(!floatingImg) return;
  const l=makeLayer('Imagen');
  const c=imgCenter();
  const nn=mainCanvas.classList.contains('nearest-neighbor');
  l.ctx.save();
  l.ctx.imageSmoothingEnabled=!nn;
  l.ctx.translate(c.x,c.y); l.ctx.rotate(floatingImg.angle);
  l.ctx.globalAlpha=floatingImg.opacity;
  l.ctx.drawImage(floatingImg.img,-floatingImg.w/2,-floatingImg.h/2,floatingImg.w,floatingImg.h);
  l.ctx.restore();
  layers.splice(activeLayerIndex+1,0,l); activeLayerIndex++;
  floatingImg=null; imgDrag=null;
  overlayCtx.clearRect(0,0,DOC.w,DOC.h);
  composite(); renderLayerList(); updateActiveThumbnail();
  refreshImagePanel();
  toast('Imagen aplicada como capa nueva');
}
function cancelImageTransform(){
  if(!floatingImg) return;
  floatingImg=null; imgDrag=null;
  overlayCtx.clearRect(0,0,DOC.w,DOC.h);
  refreshImagePanel();
  toast('Inserción de imagen cancelada');
}
function refreshImagePanel(){
  const el=document.getElementById('og-image');
  if(!el) return;
  const nearestOn=mainCanvas.classList.contains('nearest-neighbor');
  const nearestBtn='<button id="imgNearestBtn" class="tb-btn" style="width:100%; justify-content:center; border:1px solid '+(nearestOn?'var(--accent-soft)':'var(--border-soft)')+'; color:'+(nearestOn?'var(--accent)':'inherit')+'; margin-top:4px;">'+
    iconSvg('pixel')+' Vecino más cercano '+(nearestOn?'(activo)':'(pixel art)')+
  '</button>';
  if(!floatingImg){
    el.innerHTML='<div class="tool-hint">Haz clic en "Cargar imagen" para insertarla y luego moverla, escalarla y rotarla libremente antes de aplicarla como una capa nueva y editable — a diferencia del boceto de referencia, esta sí se exporta.</div>'+
      '<div class="opt-row" style="display:flex; flex-direction:column; gap:8px;">'+
        '<button id="imgLoadBtn" class="tb-btn" style="width:100%; justify-content:center; border:1px solid var(--border-soft);">'+iconSvg('image')+' Cargar imagen</button>'+
        nearestBtn+
      '</div>';
    document.getElementById('imgLoadBtn').addEventListener('click',()=>pickImageFile(startImageTransform));
  } else {
    el.innerHTML='<div class="tool-hint">Arrastra dentro para mover, las esquinas naranjas para escalar (Shift = libre) y el tirador verde para rotar (Shift = ajusta a 15°). Enter aplica, Esc cancela.</div>'+
      sliderRow('optImgOpacity','Opacidad',1,100,1,Math.round(floatingImg.opacity*100),'%')+
      '<div class="opt-row" style="display:flex; flex-direction:column; gap:8px;">'+

/* ===================== LICUAR / AGUA (deformación tipo líquido) ===================== */
function applyRadialFeather(ctx,w,h){
  ctx.save();
  ctx.globalCompositeOperation='destination-in';
  const g=ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)/2);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.65,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  ctx.restore();
}
function liquifyStep(from,to){
  const layer=layers[activeLayerIndex];
  if(layer.locked) return;
  const ctx=layer.ctx;
  const s=Math.max(10,Math.round(state.size));
  const mode=state.liquifyMode||'push';
  if(mode==='swirl'){
    const cx=to.x, cy=to.y;
    let sx=Math.round(cx-s/2), sy=Math.round(cy-s/2), sw=s, sh=s;
    if(sx<0){ sw+=sx; sx=0; } if(sy<0){ sh+=sy; sy=0; }
    if(sx+sw>DOC.w) sw=DOC.w-sx; if(sy+sh>DOC.h) sh=DOC.h-sy;
    if(sw<=1||sh<=1) return;
    let patch; try{ patch=ctx.getImageData(sx,sy,sw,sh); }catch(err){ return; }
    const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh;
    tmp.getContext('2d').putImageData(patch,0,0);
    const dragDist=Math.hypot(to.x-from.x,to.y-from.y);
    const angle=(0.1+dragDist*0.012)*state.smudgeStrength*(state.liquifyDir||1);
    const masked=document.createElement('canvas'); masked.width=sw; masked.height=sh;
    const mctx=masked.getContext('2d');
    mctx.save(); mctx.translate(sw/2,sh/2); mctx.rotate(angle); mctx.drawImage(tmp,-sw/2,-sh/2); mctx.restore();
    applyRadialFeather(mctx,sw,sh);
    ctx.save(); ctx.globalAlpha=Math.min(1,state.smudgeStrength+0.2); ctx.drawImage(masked,sx,sy); ctx.restore();
  } else if(mode==='expand'){
    const cx=to.x, cy=to.y;
    let sx=Math.round(cx-s/2), sy=Math.round(cy-s/2), sw=s, sh=s;
    if(sx<0){ sw+=sx; sx=0; } if(sy<0){ sh+=sy; sy=0; }
    if(sx+sw>DOC.w) sw=DOC.w-sx; if(sy+sh>DOC.h) sh=DOC.h-sy;
    if(sw<=1||sh<=1) return;
    let patch; try{ patch=ctx.getImageData(sx,sy,sw,sh); }catch(err){ return; }
    const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh;
    tmp.getContext('2d').putImageData(patch,0,0);
    const dragDist=Math.hypot(to.x-from.x,to.y-from.y);
    const scale=1+(0.06+dragDist*0.006)*state.smudgeStrength*2*(state.liquifyDir||1);
    const masked=document.createElement('canvas'); masked.width=sw; masked.height=sh;
    const mctx=masked.getContext('2d');
    mctx.save(); mctx.translate(sw/2,sh/2); mctx.scale(scale,scale); mctx.drawImage(tmp,-sw/2,-sh/2); mctx.restore();
    applyRadialFeather(mctx,sw,sh);
    ctx.save(); ctx.globalAlpha=Math.min(1,state.smudgeStrength+0.2); ctx.drawImage(masked,sx,sy); ctx.restore();
  } else {
    let sx=Math.round(from.x-s/2), sy=Math.round(from.y-s/2), sw=s, sh=s;
    if(sx<0){ sw+=sx; sx=0; } if(sy<0){ sh+=sy; sy=0; }
    if(sx+sw>DOC.w) sw=DOC.w-sx; if(sy+sh>DOC.h) sh=DOC.h-sy;
    if(sw<=1||sh<=1) return;
    let patch; try{ patch=ctx.getImageData(sx,sy,sw,sh); }catch(err){ return; }
    const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh;
    tmp.getContext('2d').putImageData(patch,0,0);
    applyRadialFeather(tmp.getContext('2d'),sw,sh);
    const dx=to.x-from.x, dy=to.y-from.y;
    ctx.save(); ctx.globalAlpha=state.smudgeStrength; ctx.drawImage(tmp, sx+dx, sy+dy); ctx.restore();
  }
}

/* ===================== AJUSTES DE IMAGEN ===================== */
function getFilterRegion(){
  if(state.selection && state.selection.w>=2 && state.selection.h>=2){
    return {x:Math.round(state.selection.x), y:Math.round(state.selection.y), w:Math.round(state.selection.w), h:Math.round(state.selection.h)};
  }
  return {x:0,y:0,w:DOC.w,h:DOC.h};
}
function clampByte(v){ return v<0?0:(v>255?255:v); }
function applyBrightnessContrastSaturation(brightness,contrast,saturation){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const imgData=layer.ctx.getImageData(r.x,r.y,r.w,r.h);
  const d=imgData.data;
  const cFactor=(259*(contrast+255))/(255*(259-contrast));
  const bAdd=brightness*2.55;
  const satFactor=1+saturation/100;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0) continue;
    let rr=d[i], gg=d[i+1], bb=d[i+2];
    rr=cFactor*(rr-128)+128+bAdd; gg=cFactor*(gg-128)+128+bAdd; bb=cFactor*(bb-128)+128+bAdd;
    const gray=0.299*rr+0.587*gg+0.114*bb;
    rr=gray+(rr-gray)*satFactor; gg=gray+(gg-gray)*satFactor; bb=gray+(bb-gray)*satFactor;
    d[i]=clampByte(rr); d[i+1]=clampByte(gg); d[i+2]=clampByte(bb);
  }
  const tmp=document.createElement('canvas'); tmp.width=r.w; tmp.height=r.h;
  tmp.getContext('2d').putImageData(imgData,0,0);
  compositeRegionBack(layer.ctx,r,tmp);
  composite(); updateActiveThumbnail();
}
function applyInvert(){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const imgData=layer.ctx.getImageData(r.x,r.y,r.w,r.h);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){ if(d[i+3]===0) continue; d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; }
  const tmp=document.createElement('canvas'); tmp.width=r.w; tmp.height=r.h;
  tmp.getContext('2d').putImageData(imgData,0,0);
  compositeRegionBack(layer.ctx,r,tmp);
  composite(); updateActiveThumbnail(); toast('Colores invertidos');
}
function applyBlur(px){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }

  octx.filter='blur('+px+'px)';

function applySharpen(){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const src=layer.ctx.getImageData(r.x,r.y,r.w,r.h);
  const s=src.data; const w=r.w, h=r.h;
  const out=new Uint8ClampedArray(s.length);
  const kernel=[0,-1,0,-1,5,-1,0,-1,0];
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx=(y*w+x)*4;
      if(x===0||y===0||x===w-1||y===h-1){
        out[idx]=s[idx]; out[idx+1]=s[idx+1]; out[idx+2]=s[idx+2]; out[idx+3]=s[idx+3];
        continue;
      }
      let rr=0,gg=0,bb=0,ki=0;
      for(let ky=-1;ky<=1;ky++){
        for(let kx=-1;kx<=1;kx++){
          const nIdx=((y+ky)*w+(x+kx))*4;
          const kv=kernel[ki++];
          rr+=s[nIdx]*kv; gg+=s[nIdx+1]*kv; bb+=s[nIdx+2]*kv;
        }
      }
      out[idx]=clampByte(rr); out[idx+1]=clampByte(gg); out[idx+2]=clampByte(bb); out[idx+3]=s[idx+3];
    }
  }
  const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  tmp.getContext('2d').putImageData(new ImageData(out,w,h),0,0);
  compositeRegionBack(layer.ctx,r,tmp);
  composite(); updateActiveThumbnail(); toast('Enfoque aplicado');
}
function applyPixelate(blockSize){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const smallW=Math.max(1,Math.round(r.w/blockSize)), smallH=Math.max(1,Math.round(r.h/blockSize));
  const small=document.createElement('canvas'); small.width=smallW; small.height=smallH;
  const sctx=small.getContext('2d');
  sctx.imageSmoothingEnabled=true;
  sctx.drawImage(layer.canvas, r.x,r.y,r.w,r.h, 0,0,smallW,smallH);
  const out=document.createElement('canvas'); out.width=r.w; out.height=r.h;
  const octx=out.getContext('2d');
  octx.imageSmoothingEnabled=false;
  octx.drawImage(small,0,0,smallW,smallH,0,0,r.w,r.h);
  compositeRegionBack(layer.ctx,r,out);
  composite(); updateActiveThumbnail(); toast('Pixelado aplicado');
}
function applyDistortionFilter(mapFn,label){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const src=layer.ctx.getImageData(r.x,r.y,r.w,r.h);
  const s=src.data, w=r.w, h=r.h;
  const out=new Uint8ClampedArray(s.length);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const p=mapFn(x,y,w,h);
      let sxp=Math.round(p.x), syp=Math.round(p.y);
      const idx=(y*w+x)*4;
      if(sxp<0||syp<0||sxp>=w||syp>=h){ out[idx]=0; out[idx+1]=0; out[idx+2]=0; out[idx+3]=0; continue; }
      const sIdx=(syp*w+sxp)*4;
      out[idx]=s[sIdx]; out[idx+1]=s[sIdx+1]; out[idx+2]=s[sIdx+2]; out[idx+3]=s[sIdx+3];
    }
  }
  const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  tmp.getContext('2d').putImageData(new ImageData(out,w,h),0,0);
  compositeRegionBack(layer.ctx,r,tmp);
  composite(); updateActiveThumbnail(); toast(label+' aplicado');
}
function applyWaterRipple(){
  const wavelength=42, amplitude=14;
  applyDistortionFilter((x,y,w,h)=>({
    x:x+Math.sin(y/wavelength*Math.PI*2)*amplitude,
    y:y+Math.sin(x/wavelength*Math.PI*2)*amplitude
  }),'Ondas de agua');
}
function applySwirlFilter(){
  applyDistortionFilter((x,y,w,h)=>{
    const cx=w/2, cy=h/2;
    const dx=x-cx, dy=y-cy;
    const dist=Math.hypot(dx,dy);
    const radius=Math.min(w,h)/2;
    if(dist>radius) return {x,y};
    const angle=Math.pow(1-dist/radius,2)*Math.PI*2.2;
    const ca=Math.cos(angle), sa=Math.sin(angle);
    return {x:cx+dx*ca-dy*sa, y:cy+dx*sa+dy*ca};
  },'Remolino');
}
function applyGlassFilter(){
  applyDistortionFilter((x,y,w,h)=>({
    x:x+(Math.sin(y*0.35)+Math.sin(x*0.19+y*0.07))*3.2,
    y:y+(Math.cos(x*0.35)+Math.sin(y*0.19+x*0.07))*3.2
  }),'Cristal de agua');
}
function applyCanvasFilter(cssFilter,label){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();

  const out=document.createElement('canvas'); out.width=r.w; out.height=r.h;
  const octx=out.getContext('2d');
  octx.filter=cssFilter;
  octx.drawImage(tmp,0,0);
  compositeRegionBack(layer.ctx,r,out);
  composite(); updateActiveThumbnail(); toast(label+' aplicado');
}
function applyGrayscale(){ applyCanvasFilter('grayscale(1)','Escala de grises'); }
function applySepiaFilter(){ applyCanvasFilter('sepia(1)','Sepia'); }
function applyHueRotate(deg){ applyCanvasFilter('hue-rotate('+deg+'deg)','Tono rotado'); }
function applyPosterize(levels){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const imgData=layer.ctx.getImageData(r.x,r.y,r.w,r.h);
  const d=imgData.data;
  const step=255/(levels-1);
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0) continue;
    d[i]=clampByte(Math.round(Math.round(d[i]/step)*step));
    d[i+1]=clampByte(Math.round(Math.round(d[i+1]/step)*step));
    d[i+2]=clampByte(Math.round(Math.round(d[i+2]/step)*step));
  }
  const tmp=document.createElement('canvas'); tmp.width=r.w; tmp.height=r.h;
  tmp.getContext('2d').putImageData(imgData,0,0);
  compositeRegionBack(layer.ctx,r,tmp);
  composite(); updateActiveThumbnail(); toast('Posterizado aplicado');
}
function applyThreshold(){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const imgData=layer.ctx.getImageData(r.x,r.y,r.w,r.h);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0) continue;
    const gray=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
    const v=gray>128?255:0;
    d[i]=v; d[i+1]=v; d[i+2]=v;
  }
  const tmp=document.createElement('canvas'); tmp.width=r.w; tmp.height=r.h;
  tmp.getContext('2d').putImageData(imgData,0,0);
  compositeRegionBack(layer.ctx,r,tmp);
  composite(); updateActiveThumbnail(); toast('Blanco y negro puro aplicado');
}
function applyGrain(amount){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const imgData=layer.ctx.getImageData(r.x,r.y,r.w,r.h);
  const d=imgData.data;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]===0) continue;
    const n=(Math.random()*2-1)*amount;
    d[i]=clampByte(d[i]+n); d[i+1]=clampByte(d[i+1]+n); d[i+2]=clampByte(d[i+2]+n);
  }
  const tmp=document.createElement('canvas'); tmp.width=r.w; tmp.height=r.h;
  tmp.getContext('2d').putImageData(imgData,0,0);
  compositeRegionBack(layer.ctx,r,tmp);
  composite(); updateActiveThumbnail(); toast('Grano de película aplicado');
}
function applyVignette(strength){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const imgData=layer.ctx.getImageData(r.x,r.y,r.w,r.h);
  const d=imgData.data; const w=r.w,h=r.h;
  const cx=w/2, cy=h/2, maxDist=Math.hypot(cx,cy)||1;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      if(d[i+3]===0) continue;
      const dist=Math.hypot(x-cx,y-cy)/maxDist;
      const factor=Math.max(0,1-strength*dist*dist);
      d[i]=clampByte(d[i]*factor); d[i+1]=clampByte(d[i+1]*factor); d[i+2]=clampByte(d[i+2]*factor);
    }
  }
  const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  tmp.getContext('2d').putImageData(imgData,0,0);
  compositeRegionBack(layer.ctx,r,tmp);
  composite(); updateActiveThumbnail(); toast('Viñeta aplicada');
}
function applyChromaticAberration(shift){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=getFilterRegion();
  const src=layer.ctx.getImageData(r.x,r.y,r.w,r.h);
  const s=src.data, w=r.w, h=r.h;
  const out=new Uint8ClampedArray(s.length);
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const idx=(y*w+x)*4;
      const rx=Math.min(w-1,Math.max(0,x-shift));
      const bx=Math.min(w-1,Math.max(0,x+shift));
      const rIdx=(y*w+rx)*4, bIdx=(y*w+bx)*4;
      out[idx]=s[rIdx]; out[idx+1]=s[idx+1]; out[idx+2]=s[bIdx+2]; out[idx+3]=s[idx+3];
    }
  }
  const tmp=document.createElement('canvas'); tmp.width=w; tmp.height=h;
  tmp.getContext('2d').putImageData(new ImageData(out,w,h),0,0);
  compositeRegionBack(layer.ctx,r,tmp);
  composite(); updateActiveThumbnail(); toast('Aberración cromática aplicada');
}

  'Dibuja un objeto de tu escritorio desde tres ángulos distintos.',
  'Bocetea una criatura mitad animal, mitad máquina.',
  'Dibuja una escena urbana usando solo tres colores.',

  'Dibuja un vehículo que no exista todavía.',
  'Haz un autorretrato usando solo formas y sin detalles del rostro.',
  'Diseña el logotipo de una tienda inventada.',
  'Dibuja una habitación vista desde arriba (planta).',
  'Ilustra el interior de una máquina imaginaria.',
  'Dibuja un monstruo amigable que vive debajo de la cama.',
  'Practica sombreado: una esfera con tres fuentes de luz distintas.',
  'Dibuja un mapa de un lugar que solo existe en tu imaginación.',
  'Ilustra tu día en seis viñetas pequeñas.',
  'Diseña un traje para un personaje de otro planeta.',
  'Dibuja un árbol que en realidad es un edificio.',
  'Practica perspectiva: una calle que se aleja hasta el horizonte.',
  'Dibuja un animal combinando rasgos de dos especies distintas.',

];
let calMonth=new Date().getMonth(), calYear=new Date().getFullYear();
function loadPracticeDays(){ try{return JSON.parse(localStorage.getItem('suavelienzo_dias')||'[]');}catch(e){return [];} }
function savePracticeDays(arr){ localStorage.setItem('suavelienzo_dias', JSON.stringify(arr)); }
function fmtDate(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function renderCalendar(){
  const label=new Date(calYear,calMonth,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});
  document.getElementById('calLabel').textContent=label.charAt(0).toUpperCase()+label.slice(1);
  const days=loadPracticeDays();
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  ['L','M','X','J','V','S','D'].forEach(d=>{ const el=document.createElement('div'); el.className='dow'; el.textContent=d; grid.appendChild(el); });
  const first=new Date(calYear,calMonth,1);
  let startOffset=(first.getDay()+6)%7;
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  for(let i=0;i<startOffset;i++){ const el=document.createElement('div'); el.className='day empty'; grid.appendChild(el); }
  for(let d=1;d<=daysInMonth;d++){
    const el=document.createElement('div'); el.className='day';
    const dateStr=fmtDate(calYear,calMonth,d);
    if(days.includes(dateStr)) el.className+=' done';
    if(calYear===today.getFullYear() && calMonth===today.getMonth() && d===today.getDate()) el.className+=' today';
    el.textContent=d;
    grid.appendChild(el);
  }
  const streak=computeStreak(days);
  document.getElementById('streakNum').textContent=streak;
  const todayStr=fmtDate(today.getFullYear(),today.getMonth(),today.getDate());
  const markBtn=document.getElementById('markTodayBtn');
  if(days.includes(todayStr)){ markBtn.textContent='Sesión de hoy registrada'; markBtn.disabled=true; }
  else{ markBtn.textContent='Registrar sesión de hoy'; markBtn.disabled=false; }
}
function computeStreak(days){
  const set=new Set(days);
  let streak=0; let d=new Date();
  while(true){
    const s=fmtDate(d.getFullYear(),d.getMonth(),d.getDate());
    if(set.has(s)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
document.getElementById('calPrev').addEventListener('click',()=>{ calMonth--; if(calMonth<0){calMonth=11; calYear--;} renderCalendar(); });
document.getElementById('calNext').addEventListener('click',()=>{ calMonth++; if(calMonth>11){calMonth=0; calYear++;} renderCalendar(); });
document.getElementById('markTodayBtn').addEventListener('click',()=>{
  const days=loadPracticeDays();
  const today=new Date();
  const todayStr=fmtDate(today.getFullYear(),today.getMonth(),today.getDate());
  if(!days.includes(todayStr)){ days.push(todayStr); savePracticeDays(days); renderCalendar(); toast('Sesión de hoy registrada'); }
});
function dayOfYear(d){ const start=new Date(d.getFullYear(),0,0); return Math.floor((d-start)/86400000); }
function renderIdea(random){
  const idx=random? Math.floor(Math.random()*IDEAS.length) : dayOfYear(new Date())%IDEAS.length;
  document.getElementById('ideaText').textContent=IDEAS[idx];
}
document.getElementById('ideaShuffle').addEventListener('click',()=>renderIdea(true));

/* ===================== TEMPORIZADOR DE PRÁCTICA ===================== */
let timerSeconds=120, timerRemaining=120, timerInterval=null, timerRunning=false;
function formatTimer(sec){
  const m=Math.floor(sec/60), s=sec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function updateTimerDisplay(){
  document.getElementById('timerDisplay').textContent=formatTimer(Math.max(0,timerRemaining));
}
function startTimer(){
  if(timerRunning) return;
  if(timerRemaining<=0) timerRemaining=timerSeconds;
  timerRunning=true;
  document.getElementById('timerStart').textContent='Pausar';
  timerInterval=setInterval(()=>{
    timerRemaining--;
    updateTimerDisplay();
    if(timerRemaining<=0){
      clearInterval(timerInterval); timerInterval=null; timerRunning=false;
      document.getElementById('timerStart').textContent='Iniciar';
      document.getElementById('timerDisplay').style.color='var(--accent)';
      toast('¡Tiempo! Sesión de práctica terminada');
      setTimeout(()=>{ document.getElementById('timerDisplay').style.color='var(--text)'; },3000);
    }
  },1000);
}
function pauseTimer(){
  timerRunning=false;
  if(timerInterval){ clearInterval(timerInterval); timerInterval=null; }
  document.getElementById('timerStart').textContent='Reanudar';
}
document.getElementById('timerStart').addEventListener('click',()=>{
  if(timerRunning) pauseTimer(); else startTimer();
});
document.getElementById('timerReset').addEventListener('click',()=>{
  pauseTimer();
  timerRemaining=timerSeconds;
  document.getElementById('timerStart').textContent='Iniciar';
  document.getElementById('timerDisplay').style.color='var(--text)';
  updateTimerDisplay();
});
document.getElementById('timerPresetSeg').querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    pauseTimer();
    timerSeconds=parseInt(btn.dataset.s);
    timerRemaining=timerSeconds;
    document.getElementById('timerStart').textContent='Iniciar';
    document.getElementById('timerDisplay').style.color='var(--text)';
    document.getElementById('timerPresetSeg').querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    updateTimerDisplay();
  });
});
updateTimerDisplay();

/* ===================== FAVICON CON PUNTO DE COLOR ===================== */
(function initAnimatedFavicon(){
  try{
    const link=document.querySelector('link[rel="icon"]');
    if(!link || !document.createElement('canvas').getContext) return;
    const dotColors=['#e2a34d','#5cc28a','#4d9ce2','#e05a5a','#c05ce2','#e8d24d'];
    let colorIndex=0;
    const size=64;
    const canvas=document.createElement('canvas');
    canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext('2d');
    function drawFavicon(color){
      ctx.clearRect(0,0,size,size);
      const r=size*0.22;
      ctx.beginPath();
      ctx.moveTo(r,0); ctx.lineTo(size-r,0); ctx.quadraticCurveTo(size,0,size,r);
      ctx.lineTo(size,size-r); ctx.quadraticCurveTo(size,size,size-r,size);
      ctx.lineTo(r,size); ctx.quadraticCurveTo(0,size,0,size-r);
      ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0); ctx.closePath();
      ctx.fillStyle='#141519'; ctx.fill();
      ctx.save();
      ctx.strokeStyle='#e2a34d'; ctx.lineWidth=size*0.075; ctx.lineCap='round'; ctx.lineJoin='round';
      const s=size/24;
      ctx.beginPath();
      ctx.moveTo(4*s,20*s);
      ctx.bezierCurveTo(4*s,17*s,6*s,15*s,9*s,15*s);
      ctx.bezierCurveTo(11*s,15*s,13*s,17*s,13*s,19*s);
      ctx.bezierCurveTo(13*s,21*s,11*s,23*s,9*s,23*s);
      ctx.bezierCurveTo(6*s,23*s,4*s,22*s,4*s,20*s);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(9*s,15*s); ctx.lineTo(19*s,5*s);
      ctx.bezierCurveTo(20*s,4*s,21*s,4*s,22*s,5*s);
      ctx.bezierCurveTo(23*s,6*s,23*s,7*s,22*s,8*s);
      ctx.lineTo(12*s,18*s);
      ctx.stroke();
      ctx.restore();
      ctx.beginPath();
      ctx.arc(size*0.82,size*0.18,size*0.11,0,Math.PI*2);
      ctx.fillStyle=color;
      ctx.fill();
      ctx.lineWidth=size*0.03; ctx.strokeStyle='#141519'; ctx.stroke();
      link.href=canvas.toDataURL('image/png');
    }
    drawFavicon(dotColors[0]);
    setInterval(()=>{
      colorIndex=(colorIndex+1)%dotColors.length;
      drawFavicon(dotColors[colorIndex]);
    },10000);
  }catch(err){ /* si el navegador no lo permite, se queda con el ícono fijo original */ }
})();

})();

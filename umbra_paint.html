<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>UMBRA_PAINT — Estudio de dibujo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23141519'/%3E%3Cpath d='M4 20c0-3 2-5 5-5s4 2 4 4-2 4-4 4-5-1-5-3z' fill='none' stroke='%23e2a34d' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M9 15 19 5c1-1 2-1 3 0s1 2 0 3L12 18' fill='none' stroke='%23e2a34d' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101114; --panel:#17181c; --panel2:#1d1f24; --panel3:#232630;
  --border:#2b2e36; --border-soft:#22242b;
  --text:#e9eaee; --text-dim:#8d93a1; --text-faint:#5c616e;
  --accent:#e2a34d; --accent-soft:#7a5a2c; --accent-glow:rgba(226,163,77,.18);
  --danger:#e2664d; --ok:#5cc28a;
  --radius:8px; --radius-sm:5px;
  --canvas-bg:#ffffff;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Kalam',cursive,system-ui,sans-serif;
  overflow:hidden; -webkit-tap-highlight-color:transparent;
  user-select:none;
}
input,select,button,textarea{font-family:'Kalam',cursive,inherit; color:inherit;}
.mono{font-family:'IBM Plex Mono',monospace;}
button{cursor:pointer;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex; flex-direction:column; height:100vh;}

/* ---------- TOPBAR ---------- */
#topbar{
  height:52px; flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:0 14px; background:var(--panel); border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:8px; margin-right:6px;}
.brand svg{width:22px; height:22px; color:var(--accent);}
.brand span{font-weight:700; font-size:15px; letter-spacing:.2px;}
.brand small{display:block; font-size:9.5px; color:var(--text-faint); font-weight:500; letter-spacing:.4px;}
.tb-group{display:flex; align-items:center; gap:4px; padding:0 8px; border-right:1px solid var(--border-soft); height:30px;}
.tb-group:last-of-type{border-right:none;}
.tb-btn{
  display:flex; align-items:center; gap:6px; height:30px; padding:0 10px;
  background:transparent; border:1px solid transparent; border-radius:var(--radius-sm);
  color:var(--text-dim); font-size:12.5px; font-weight:500; white-space:nowrap;
}
.tb-btn svg{width:15px; height:15px; flex:0 0 auto;}
.tb-btn:hover{background:var(--panel3); color:var(--text); border-color:var(--border);}
.tb-btn.active{background:var(--accent-glow); border-color:var(--accent-soft); color:var(--accent);}
.tb-btn:disabled{opacity:.3; cursor:default;}
.tb-btn:disabled:hover{background:transparent; border-color:transparent;}
.tb-icon-btn{width:30px; padding:0; justify-content:center;}
#topbar-spacer{flex:1;}
.zoom-readout{width:52px; text-align:center; font-size:11.5px; color:var(--text-dim); background:var(--panel2); border:1px solid var(--border-soft); border-radius:5px; padding:5px 2px;}
.zoom-readout:focus{outline:none; border-color:var(--accent-soft); color:var(--text);}
#zoomPreset{
  background:var(--panel2); border:1px solid var(--border-soft); border-radius:5px; color:var(--text-dim);
  font-size:11px; padding:6px 4px; height:30px;
}
.cursor-grab{cursor:grab;}
.cursor-grabbing{cursor:grabbing;}

/* ---------- MAIN LAYOUT ---------- */
#main{flex:1; display:grid; grid-template-columns:58px 216px 1fr 272px; min-height:0;}

/* ---------- LEFT TOOLBAR ---------- */
#toolbar{
  background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0; overflow-y:auto;
}
.tool-btn{
  width:40px; height:40px; border-radius:var(--radius-sm); border:1px solid transparent;
  background:transparent; display:flex; align-items:center; justify-content:center;
  color:var(--text-dim); position:relative;
}
.tool-btn svg{width:19px; height:19px;}
.tool-btn:hover{background:var(--panel3); color:var(--text);}
.tool-btn.active{background:var(--accent-glow); border-color:var(--accent-soft); color:var(--accent);}
.tool-sep{width:26px; height:1px; background:var(--border-soft); margin:6px 0;}
.tool-btn .kbd{
  position:absolute; bottom:1px; right:2px; font-size:7.5px; font-family:'IBM Plex Mono',monospace;
  color:var(--text-faint); pointer-events:none;
}
.tool-btn.active .kbd{color:var(--accent-soft);}

/* ---------- OPTIONS PANEL ---------- */
#optionsPanel{
  background:var(--panel); border-right:1px solid var(--border);
  padding:14px 14px 20px; overflow-y:auto;
}
.opt-title{
  font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--text-faint);
  font-weight:600; margin:0 0 12px;
}
.opt-row{margin-bottom:16px;}
.opt-label{
  display:flex; justify-content:space-between; align-items:center;
  font-size:12px; color:var(--text-dim); margin-bottom:6px;
}
.opt-label .val{font-family:'IBM Plex Mono',monospace; color:var(--text); font-size:11.5px;}
input[type=range]{
  -webkit-appearance:none; width:100%; height:4px; border-radius:2px;
  background:var(--panel3); outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:14px; height:14px; border-radius:50%;
  background:var(--accent); border:2px solid #17181c; cursor:pointer; margin-top:-5px;
}
input[type=range]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%; background:var(--accent); border:2px solid #17181c; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:2px;}
.seg{display:flex; gap:4px; background:var(--panel2); padding:3px; border-radius:var(--radius-sm); border:1px solid var(--border-soft);}
.seg button{
  flex:1; background:transparent; border:none; border-radius:4px; color:var(--text-dim);
  font-size:11px; padding:6px 4px; display:flex; align-items:center; justify-content:center;
}
.seg button svg{width:15px;height:15px;}
.seg button.active{background:var(--panel3); color:var(--accent);}
.check-row{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); margin-bottom:14px; cursor:pointer;}
.check-row input{accent-color:var(--accent); width:14px; height:14px;}
.tool-hint{font-size:11px; line-height:1.5; color:var(--text-faint); border-top:1px solid var(--border-soft); padding-top:12px; margin-top:4px;}
.opt-group{display:none;}
.opt-group.visible{display:block;}

/* ---------- CANVAS AREA ---------- */
#canvasAreaOuter{
  display:grid; grid-template-columns:0 1fr; grid-template-rows:0 1fr; min-height:0; min-width:0;
  background:#0b0c0e; transition:grid-template-columns .15s, grid-template-rows .15s;
}
#canvasAreaOuter.show-rulers{grid-template-columns:22px 1fr; grid-template-rows:22px 1fr;}
#rulerCorner{background:var(--panel2); border-right:1px solid var(--border-soft); border-bottom:1px solid var(--border-soft);}
#rulerH{width:100%; height:100%; display:block; background:var(--panel2); border-bottom:1px solid var(--border-soft);}
#rulerV{width:100%; height:100%; display:block; background:var(--panel2); border-right:1px solid var(--border-soft);}
#canvasArea{
  position:relative; background:#0b0c0e; overflow:auto; grid-column:2; grid-row:2; min-height:0; min-width:0;
  display:flex; align-items:flex-start; justify-content:flex-start;
  background-image:
    linear-gradient(45deg,#111217 25%,transparent 25%),
    linear-gradient(-45deg,#111217 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#111217 75%),
    linear-gradient(-45deg,transparent 75%,#111217 75%);
  background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0px;
}
#canvasPad{padding:60px;}
#canvasArea.light-area{
  background-color:#d7d9dd;
  background-image:
    linear-gradient(45deg,#c7c9ce 25%,transparent 25%),
    linear-gradient(-45deg,#c7c9ce 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#c7c9ce 75%),
    linear-gradient(-45deg,transparent 75%,#c7c9ce 75%);
}
#canvasWrapper{position:relative; box-shadow:0 12px 40px rgba(0,0,0,.5); flex:0 0 auto;}
#canvasWrapper.mirrored{transform:scaleX(-1);}
#mainCanvas, #overlayCanvas{position:absolute; top:0; left:0; display:block;}
#mainCanvas{background:var(--canvas-bg); z-index:1;}
#mainCanvas.nearest-neighbor{ image-rendering:pixelated; image-rendering:crisp-edges; }
.layer-toolbar button.on{background:var(--accent-glow); border-color:var(--accent-soft); color:var(--accent);}
.layer-row.clipped{margin-left:16px; box-shadow:inset 3px 0 0 var(--accent);}
.layer-row.clipped .name::before{content:'↳ '; color:var(--accent);}
#overlayCanvas{touch-action:none; z-index:3;}
.cursor-crosshair{cursor:crosshair;}
.cursor-none{cursor:none;}
.cursor-move{cursor:move;}
.cursor-text{cursor:text;}
.cursor-pointer{cursor:pointer;}
.cursor-cell{cursor:cell;}

/* ---------- RIGHT PANEL ---------- */
#rightPanel{background:var(--panel); border-left:1px solid var(--border); display:flex; flex-direction:column; min-height:0;}
#rpTabs{display:flex; border-bottom:1px solid var(--border);}
#rpTabs button{
  flex:1; background:transparent; border:none; padding:11px 0; font-size:12px; font-weight:600;
  color:var(--text-faint); border-bottom:2px solid transparent;
}
#rpTabs button.active{color:var(--accent); border-color:var(--accent);}
.rp-pane{display:none; flex:1; min-height:0; overflow-y:auto; padding:14px;}
.rp-pane.active{display:flex; flex-direction:column;}

/* Layers */
.layer-toolbar{display:flex; gap:6px; margin-bottom:10px;}
.layer-toolbar button{
  flex:1; background:var(--panel2); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:7px 4px; color:var(--text-dim); font-size:10.5px; display:flex; flex-direction:column; align-items:center; gap:3px;
}
.layer-toolbar button svg{width:14px; height:14px;}
.layer-toolbar button:hover{color:var(--text); border-color:var(--border);}
#layerList{display:flex; flex-direction:column; gap:6px;}
.layer-row{
  display:flex; align-items:center; gap:8px; background:var(--panel2); border:1px solid var(--border-soft);
  border-radius:var(--radius-sm); padding:7px; cursor:pointer;
}
.layer-row.active{border-color:var(--accent-soft); background:var(--accent-glow);}
.layer-row .vis{width:20px; height:20px; flex:0 0 auto; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
.layer-row .vis svg{width:15px; height:15px;}
.layer-row .thumb{
  width:38px; height:30px; border-radius:3px; overflow:hidden; flex:0 0 auto; border:1px solid var(--border-soft);
  background:
    linear-gradient(45deg,#3a3d45 25%,transparent 25%),linear-gradient(-45deg,#3a3d45 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#3a3d45 75%),linear-gradient(-45deg,transparent 75%,#3a3d45 75%);
  background-size:8px 8px; background-position:0 0,0 4px,4px -4px,-4px 0px; background-color:#2a2c33;
}
.layer-row .thumb canvas{width:100%; height:100%; display:block;}
.layer-meta{flex:1; min-width:0;}
.layer-meta .name{font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.layer-meta .sub{display:flex; align-items:center; gap:6px; margin-top:3px;}
.layer-meta select{background:var(--panel3); border:1px solid var(--border-soft); border-radius:3px; font-size:9.5px; color:var(--text-dim); padding:1px 3px;}
.layer-meta input[type=range]{width:52px; height:3px;}
.layer-row .lock{width:16px; height:16px; flex:0 0 auto; color:var(--text-faint); display:flex;}
.layer-row .lock svg{width:13px; height:13px;}
.layer-row .lock.on{color:var(--accent);}

/* Color */
#svCanvas{width:100%; aspect-ratio:1.5/1; border-radius:var(--radius-sm); cursor:crosshair; display:block; border:1px solid var(--border-soft);}
#hueSlider{
  -webkit-appearance:none; width:100%; height:14px; border-radius:7px; margin-top:12px;
  background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);
}
#hueSlider::-webkit-slider-thumb{
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff;
  border:2px solid #17181c; box-shadow:0 0 0 1px rgba(0,0,0,.4); margin-top:-1px; cursor:pointer;
}
.swatch-row{display:flex; align-items:center; gap:10px; margin-top:14px;}
#currentSwatch{width:38px; height:38px; border-radius:var(--radius-sm); border:2px solid var(--border); flex:0 0 auto;}
#hexInput{
  flex:1; background:var(--panel2); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:9px 10px; font-size:13px; font-family:'IBM Plex Mono',monospace;
}
.opt-title.mt{margin-top:18px;}
.preset-grid{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-top:8px;}
.preset-grid div{width:100%; aspect-ratio:1; border-radius:4px; border:1px solid rgba(255,255,255,.08); cursor:pointer;}
#recentColors{display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-top:8px; min-height:20px;}
#recentColors div{width:100%; aspect-ratio:1; border-radius:4px; border:1px solid rgba(255,255,255,.08); cursor:pointer;}

/* Calendar */
.cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.cal-head button{background:var(--panel2); border:1px solid var(--border-soft); border-radius:5px; width:26px; height:26px; color:var(--text-dim); display:flex; align-items:center; justify-content:center;}
.cal-head button svg{width:13px; height:13px;}
.cal-head .label{font-size:13px; font-weight:600;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; font-size:10.5px; text-align:center;}
.cal-grid .dow{color:var(--text-faint); font-weight:600; padding-bottom:4px;}
.cal-grid .day{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:5px;
  color:var(--text-dim); background:var(--panel2); border:1px solid transparent;
}
.cal-grid .day.empty{background:transparent;}
.cal-grid .day.today{border-color:var(--accent-soft);}
.cal-grid .day.done{background:var(--accent-glow); color:var(--accent); font-weight:600;}
.streak-box{
  margin-top:14px; background:var(--panel2); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:12px; display:flex; align-items:center; gap:12px;
}
.streak-box .num{font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; color:var(--accent);}
.streak-box .lbl{font-size:11px; color:var(--text-dim); line-height:1.4;}
#markTodayBtn{
  margin-top:12px; width:100%; padding:11px; border-radius:var(--radius-sm); border:1px solid var(--accent-soft);
  background:var(--accent-glow); color:var(--accent); font-weight:600; font-size:12.5px;
}
#markTodayBtn:disabled{opacity:.5;}
.idea-box{margin-top:18px; background:var(--panel2); border:1px solid var(--border-soft); border-radius:var(--radius-sm); padding:13px;}
.idea-box .tag{font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text-faint); font-weight:600;}
.idea-box p{font-size:13px; line-height:1.5; margin:8px 0 10px;}
.idea-box button{width:100%; padding:8px; border-radius:5px; border:1px solid var(--border-soft); background:var(--panel3); color:var(--text-dim); font-size:11px;}

/* ---------- STATUSBAR ---------- */
#statusbar{
  height:26px; flex:0 0 auto; background:var(--panel); border-top:1px solid var(--border);
  display:flex; align-items:center; gap:18px; padding:0 14px; font-size:10.5px; color:var(--text-faint);
  font-family:'IBM Plex Mono',monospace;
}

/* ---------- MODAL ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,9,11,.72); display:flex; align-items:center; justify-content:center; z-index:100;
}
.modal-box{
  background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:22px;
  width:380px; max-width:90vw; box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.modal-box h3{margin:0 0 4px; font-size:16px;}
.modal-box .sub{font-size:12px; color:var(--text-faint); margin:0 0 16px;}
.preset-list{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
.preset-list button{
  text-align:left; background:var(--panel2); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
  padding:10px; color:var(--text);
}
.preset-list button:hover, .preset-list button.sel{border-color:var(--accent-soft); background:var(--accent-glow);}
.preset-list button b{display:block; font-size:12px;}
.preset-list button span{font-size:10.5px; color:var(--text-faint); font-family:'IBM Plex Mono',monospace;}
.custom-dims{display:flex; gap:8px; align-items:center; margin-bottom:16px;}
.custom-dims input{
  width:100%; background:var(--panel2); border:1px solid var(--border-soft); border-radius:5px; padding:8px;
  color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:12px;
}
.custom-dims span{color:var(--text-faint); font-size:12px;}
.modal-actions{display:flex; gap:8px; justify-content:flex-end;}
.modal-actions button{padding:9px 16px; border-radius:6px; font-size:12.5px; font-weight:600; border:1px solid var(--border-soft); background:var(--panel2); color:var(--text-dim);}
.modal-actions button.primary{background:var(--accent); border-color:var(--accent); color:#1a1305;}

/* Text editor overlay */
.text-edit-box{
  position:absolute; min-width:60px; min-height:24px; outline:2px dashed var(--accent);
  background:rgba(255,255,255,.04); padding:2px 4px; white-space:pre; line-height:1.15;
}

/* Toast */
#toastHost{position:fixed; bottom:38px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{
  background:#1c1e24; border:1px solid var(--border); padding:9px 16px; border-radius:20px;
  font-size:12px; color:var(--text); box-shadow:0 6px 20px rgba(0,0,0,.4); animation:toastIn .18s ease-out;
}
@keyframes toastIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

/* ---------- SPLASH / PORTADA ---------- */
#splash{
  position:fixed; inset:0; z-index:500; background:radial-gradient(circle at 50% 40%, #1b1d23 0%, #0c0d10 75%);
  display:flex; align-items:center; justify-content:center; transition:opacity .5s ease, visibility .5s;
}
#splash.hidden{opacity:0; visibility:hidden; pointer-events:none;}
#splashCard{display:flex; flex-direction:column; align-items:center; text-align:center; padding:20px;}
#splashBrush{
  width:120px; height:120px; color:var(--accent); margin-bottom:18px;
  filter:drop-shadow(0 10px 30px var(--accent-glow));
}
#splashBrushBody, #splashBrushHandle{
  stroke-dasharray:60; stroke-dashoffset:60; animation:splashDraw 1.1s ease forwards;
}
#splashBrushHandle{animation-delay:.15s;}
@keyframes splashDraw{ to{stroke-dashoffset:0;} }
#splashCard h1{
  font-size:30px; margin:0 0 8px; letter-spacing:.3px; font-weight:700;
  opacity:0; animation:splashFadeUp .6s ease .5s forwards;
}
#splashCard p{
  font-size:13px; color:var(--text-dim); margin:0 0 26px; max-width:320px; line-height:1.5;
  opacity:0; animation:splashFadeUp .6s ease .65s forwards;
}
#splashStart{
  padding:12px 26px; border-radius:24px; border:1px solid var(--accent-soft); background:var(--accent-glow);
  color:var(--accent); font-weight:600; font-size:13px;
  opacity:0; animation:splashFadeUp .6s ease .8s forwards;
}
#splashStart:hover{background:var(--accent); color:#1a1305;}
@keyframes splashFadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

@media (max-width:900px){
  #optionsPanel{display:none;}
  #main{grid-template-columns:52px 1fr 240px;}
}
</style>
</head>
<body>
<div id="splash">
  <div id="splashCard">
    <svg id="splashBrush" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path id="splashBrushBody" d="M4 20c0-3 2-5 5-5s4 2 4 4-2 4-4 4-5-1-5-3z"/>
      <path id="splashBrushHandle" d="M9 15 19 5c1-1 2-1 3 0s1 2 0 3L12 18"/>
    </svg>
    <h1>UMBRA_PAINT</h1>
    <p>Estudio de dibujo — pincel suave, formas, capas y práctica diaria.</p>
    <button id="splashStart">Empezar a dibujar</button>
  </div>
</div>
<div id="app">

  <header id="topbar">
    <div class="brand">

function toast(msg){

function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
function lerp(a,b,t){return a+(b-a)*t;}

function hsvToHex(h,s,v){
  h=h/360; let r,g,b;
  const i=Math.floor(h*6), f=h*6-i, p=v*(1-s), q=v*(1-f*s), t=v*(1-(1-f)*s);
  switch(i%6){
    case 0: r=v;g=t;b=p; break; case 1: r=q;g=v;b=p; break; case 2: r=p;g=v;b=t; break;
    case 3: r=p;g=q;b=v; break; case 4: r=t;g=p;b=v; break; case 5: r=v;g=p;b=q; break;
  }
  const h2=x=>{const s=Math.round(x*255).toString(16).padStart(2,'0');return s;};
  return '#'+h2(r)+h2(g)+h2(b);
}
function hexToRgb(hex){
  hex=hex.replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const num=parseInt(hex,16);
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function rgbToHsv(r,g,b){
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0;
  if(d!==0){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h*=60; if(h<0)h+=360;
  }
  const s=max===0?0:d/max, v=max;
  return {h,s,v};
}

function composite(){
  const nn=mainCanvas.classList.contains('nearest-neighbor');
  mainCtx.imageSmoothingEnabled=!nn;
  mainCtx.clearRect(0,0,DOC.w,DOC.h);
  drawLayersTo(mainCtx,{wet:true});
  if(refImage && refImage.visible && refImage.canvas){
    mainCtx.save();
    mainCtx.globalAlpha=refImage.opacity;
    mainCtx.globalCompositeOperation='source-over';
    const dw=refImage.w*refImage.scale, dh=refImage.h*refImage.scale;
    mainCtx.drawImage(refImage.canvas, refImage.x, refImage.y, dw, dh);
    mainCtx.restore();
  }
}
function getClipTmp(){
  if(!_clipTmp||_clipTmp.width!==DOC.w||_clipTmp.height!==DOC.h){ _clipTmp=document.createElement('canvas'); _clipTmp.width=DOC.w; _clipTmp.height=DOC.h; }
  return _clipTmp;
}
function clipBaseIndex(i){ let b=i-1; while(b>=0 && layers[b].clip) b--; return b; }
/* Dibuja todas las capas visibles en ctx respetando mezcla, opacidad y máscaras de recorte */
function drawLayersTo(ctx,opts){
  opts=opts||{};
  for(let li=0;li<layers.length;li++){
    const layer=layers[li];
    if(!layer.visible) continue;
    if(opts.skip && opts.skip(layer,li)) continue;
    const withWet=opts.wet && li===activeLayerIndex && wetCanvas;
    const bi=layer.clip?clipBaseIndex(li):-1;
    ctx.save();
    ctx.globalAlpha=layer.opacity;
    ctx.globalCompositeOperation=layer.blend||'source-over';
    if(layer.clip && bi>=0){
      if(layers[bi].visible){
        const t=getClipTmp(), tc=t.getContext('2d');
        tc.globalCompositeOperation='source-over'; tc.globalAlpha=1;
        tc.clearRect(0,0,DOC.w,DOC.h);
        tc.drawImage(layer.canvas,0,0);
        if(withWet){ tc.globalAlpha=state.opacity; tc.drawImage(wetCanvas,0,0); tc.globalAlpha=1; }
        tc.globalCompositeOperation='destination-in';
        tc.drawImage(layers[bi].canvas,0,0);
        tc.globalCompositeOperation='source-over';
        ctx.drawImage(t,0,0);
      }
    } else {
      ctx.drawImage(layer.canvas,0,0);
      if(withWet){ ctx.globalAlpha=state.opacity; ctx.globalCompositeOperation='source-over'; ctx.drawImage(wetCanvas,0,0); }
    }
    ctx.restore();
  }
}
let compositeScheduled=false;

function flipLayer(axis){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const tmp=document.createElement('canvas'); tmp.width=DOC.w; tmp.height=DOC.h;
  tmp.getContext('2d').drawImage(layer.canvas,0,0);
  layer.ctx.save();
  layer.ctx.clearRect(0,0,DOC.w,DOC.h);
  layer.ctx.translate(axis==='h'?DOC.w:0, axis==='v'?DOC.h:0);
  layer.ctx.scale(axis==='h'?-1:1, axis==='v'?-1:1);
  layer.ctx.drawImage(tmp,0,0);
  layer.ctx.restore();
  composite(); updateActiveThumbnail(); toast(axis==='h'?'Capa volteada horizontalmente':'Capa volteada verticalmente');
}
function rotateLayer90(){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const tmp=document.createElement('canvas'); tmp.width=DOC.w; tmp.height=DOC.h;
  tmp.getContext('2d').drawImage(layer.canvas,0,0);
  layer.ctx.clearRect(0,0,DOC.w,DOC.h);
  layer.ctx.save();
  layer.ctx.translate(DOC.w/2,DOC.h/2);
  layer.ctx.rotate(Math.PI/2);
  layer.ctx.drawImage(tmp,-DOC.w/2,-DOC.h/2);
  layer.ctx.restore();
  composite(); updateActiveThumbnail(); toast('Capa rotada 90°');
}

/* ===================== HISTORIAL (deshacer/rehacer) ===================== */
function pushUndo(){
  const layer=layers[activeLayerIndex];
  undoStack.push({layerId:layer.id, data:layer.ctx.getImageData(0,0,DOC.w,DOC.h)});
  if(undoStack.length>25) undoStack.shift();
  redoStack=[];
  updateHistoryButtons();
}
function undo(){
  if(!undoStack.length) return;
  const item=undoStack.pop();
  const layer=layers.find(l=>l.id===item.layerId);
  if(!layer) return;
  redoStack.push({layerId:layer.id, data:layer.ctx.getImageData(0,0,DOC.w,DOC.h)});
  layer.ctx.putImageData(item.data,0,0);
  composite(); renderLayerList(); updateHistoryButtons();
}
function redo(){
  if(!redoStack.length) return;
  const item=redoStack.pop();
  const layer=layers.find(l=>l.id===item.layerId);
  if(!layer) return;
  undoStack.push({layerId:layer.id, data:layer.ctx.getImageData(0,0,DOC.w,DOC.h)});
  layer.ctx.putImageData(item.data,0,0);
  composite(); renderLayerList(); updateHistoryButtons();
}
function updateHistoryButtons(){
  document.getElementById('btnUndo').disabled=undoStack.length===0;
  document.getElementById('btnRedo').disabled=redoStack.length===0;
}
document.getElementById('btnUndo').addEventListener('click',undo);
document.getElementById('btnRedo').addEventListener('click',redo);

      setter(v);
      const valEl=document.getElementById(id+'Val');

      saveUserSettings();
    });
  };
  link('optSize', v=>state.size=v); link('optSizeP', v=>state.size=v); link('optSizeE', v=>state.size=v); link('optSizeS', v=>state.size=v);

function resizeSvCanvas(){

function drawSvCanvas(){
  const w=svCanvas.width,h=svCanvas.height;
  svCtx.fillStyle=hsvToHex(state.hue,1,1); svCtx.fillRect(0,0,w,h);
  let g=svCtx.createLinearGradient(0,0,w,0);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(1,'rgba(255,255,255,0)');
  svCtx.fillStyle=g; svCtx.fillRect(0,0,w,h);
  g=svCtx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,1)');
  svCtx.fillStyle=g; svCtx.fillRect(0,0,w,h);
  const x=state.sat*w, y=(1-state.val)*h;
  svCtx.beginPath(); svCtx.arc(x,y,6,0,Math.PI*2);
  svCtx.strokeStyle='#fff'; svCtx.lineWidth=2; svCtx.stroke();
  svCtx.beginPath(); svCtx.arc(x,y,6,0,Math.PI*2); svCtx.strokeStyle='rgba(0,0,0,.5)'; svCtx.lineWidth=1; svCtx.stroke();
}

const zoomInput=document.getElementById('zoomInput');
function applyZoom(z){
  state.zoom=clamp(z,0.08,6);
  const w=DOC.w*state.zoom, h=DOC.h*state.zoom;
  canvasWrapper.style.width=w+'px'; canvasWrapper.style.height=h+'px';
  mainCanvas.style.width=overlayCanvas.style.width=w+'px';
  mainCanvas.style.height=overlayCanvas.style.height=h+'px';
  zoomInput.value=Math.round(state.zoom*100)+'%';
  if(state.rulersVisible) drawRulers();
}
function zoomAtPoint(newZoom, clientX, clientY){
  const rect=canvasArea.getBoundingClientRect();
  const beforeX=canvasArea.scrollLeft+(clientX-rect.left);
  const beforeY=canvasArea.scrollTop+(clientY-rect.top);
  const ratio=clamp(newZoom,0.08,6)/state.zoom;
  applyZoom(newZoom);
  canvasArea.scrollLeft=beforeX*ratio-(clientX-rect.left);
  canvasArea.scrollTop=beforeY*ratio-(clientY-rect.top);
}
function fitToScreen(){
  const areaRect=canvasArea.getBoundingClientRect();
  const availW=areaRect.width-120, availH=areaRect.height-120;
  const z=clamp(Math.min(availW/DOC.w, availH/DOC.h),0.08,4);
  applyZoom(z);
  canvasArea.scrollLeft=(canvasWrapper.offsetWidth-areaRect.width)/2+60;
  canvasArea.scrollTop=(canvasWrapper.offsetHeight-areaRect.height)/2+60;
}
document.getElementById('btnZoomIn').addEventListener('click',()=>applyZoom(state.zoom*1.2));
document.getElementById('btnZoomOut').addEventListener('click',()=>applyZoom(state.zoom/1.2));

zoomInput.addEventListener('focus',()=>zoomInput.select());
zoomInput.addEventListener('blur',()=>{
  const n=parseFloat(zoomInput.value.replace('%','').replace(',','.'));
  if(!isNaN(n) && n>0) applyZoom(n/100); else zoomInput.value=Math.round(state.zoom*100)+'%';
});
document.getElementById('zoomPreset').addEventListener('change',(e)=>{
  const v=e.target.value; if(v){ applyZoom(parseFloat(v)/100); } e.target.value='';
});
canvasArea.addEventListener('wheel',(e)=>{

/* ===================== REGLAS Y GUÍAS ===================== */
const canvasAreaOuter=document.getElementById('canvasAreaOuter');
const rulerH=document.getElementById('rulerH'), rulerV=document.getElementById('rulerV');
const rulerHCtx=rulerH.getContext('2d'), rulerVCtx=rulerV.getContext('2d');
function niceStep(px){
  const raw=[10,20,25,50,100,200,250,500,1000];
  for(const s of raw){ if(s*state.zoom>=45) return s; }
  return 1000;
}
function resizeRulerCanvases(){
  rulerH.width=Math.max(1,rulerH.clientWidth); rulerH.height=Math.max(1,rulerH.clientHeight);
  rulerV.width=Math.max(1,rulerV.clientWidth); rulerV.height=Math.max(1,rulerV.clientHeight);
}
function drawRulers(){
  if(!state.rulersVisible) return;
  resizeRulerCanvases();
  const step=niceStep();
  const scrollL=canvasArea.scrollLeft, scrollT=canvasArea.scrollTop;
  rulerHCtx.clearRect(0,0,rulerH.width,rulerH.height);
  rulerHCtx.save();
  rulerHCtx.fillStyle='#8d93a1'; rulerHCtx.strokeStyle='rgba(141,147,161,.5)';
  rulerHCtx.font='9px IBM Plex Mono, monospace'; rulerHCtx.textBaseline='top';
  const startDocX=Math.floor(scrollL/state.zoom/step)*step;
  for(let docX=startDocX; docX*state.zoom-scrollL<rulerH.width; docX+=step){
    const sx=docX*state.zoom-scrollL;
    if(sx<0) continue;
    rulerHCtx.beginPath(); rulerHCtx.moveTo(sx,rulerH.height-7); rulerHCtx.lineTo(sx,rulerH.height); rulerHCtx.stroke();
    rulerHCtx.fillText(String(Math.round(docX)), sx+2, 2);
  }
  rulerHCtx.restore();
  rulerVCtx.clearRect(0,0,rulerV.width,rulerV.height);
  rulerVCtx.save();
  rulerVCtx.fillStyle='#8d93a1'; rulerVCtx.strokeStyle='rgba(141,147,161,.5)';
  rulerVCtx.font='9px IBM Plex Mono, monospace'; rulerVCtx.textBaseline='top';
  const startDocY=Math.floor(scrollT/state.zoom/step)*step;
  for(let docY=startDocY; docY*state.zoom-scrollT<rulerV.height; docY+=step){
    const sy=docY*state.zoom-scrollT;
    if(sy<0) continue;
    rulerVCtx.beginPath(); rulerVCtx.moveTo(rulerV.width-7,sy); rulerVCtx.lineTo(rulerV.width,sy); rulerVCtx.stroke();
    rulerVCtx.save(); rulerVCtx.translate(2,sy+2); rulerVCtx.rotate(0); rulerVCtx.fillText(String(Math.round(docY)),0,0); rulerVCtx.restore();
  }
  rulerVCtx.restore();
}
document.getElementById('btnRuler').addEventListener('click',(e)=>{
  state.rulersVisible=!state.rulersVisible;
  canvasAreaOuter.classList.toggle('show-rulers', state.rulersVisible);
  e.currentTarget.classList.toggle('active', state.rulersVisible);
  if(state.rulersVisible) drawRulers();
});
canvasArea.addEventListener('scroll',()=>{ if(state.rulersVisible) drawRulers(); });

function screenToDocX(clientX){ const rect=canvasArea.getBoundingClientRect(); return (canvasArea.scrollLeft+(clientX-rect.left))/state.zoom; }
function screenToDocY(clientY){ const rect=canvasArea.getBoundingClientRect(); return (canvasArea.scrollTop+(clientY-rect.top))/state.zoom; }

overlayCanvas.addEventListener('dblclick',(e)=>{
  if(!state.rulersVisible || (!state.guides.h.length && !state.guides.v.length)) return;
  const pos=getPos(e);
  const tolDoc=6/state.zoom;
  const vi=state.guides.v.findIndex(x=>Math.abs(x-pos.x)<tolDoc);
  if(vi>=0){ state.guides.v.splice(vi,1); drawStaticOverlay(); toast('Guía eliminada'); return; }
  const hi=state.guides.h.findIndex(y=>Math.abs(y-pos.y)<tolDoc);
  if(hi>=0){ state.guides.h.splice(hi,1); drawStaticOverlay(); toast('Guía eliminada'); }
});
function snapToGuides(pos){
  const tolDoc=8/state.zoom;
  let x=pos.x, y=pos.y;
  for(const gx of state.guides.v){ if(Math.abs(pos.x-gx)<tolDoc){ x=gx; break; } }
  for(const gy of state.guides.h){ if(Math.abs(pos.y-gy)<tolDoc){ y=gy; break; } }
  return {x,y,pressure:pos.pressure};
}

function drawGridAndGuides(){
  if(state.gridVisible){
    const step=50;
    overlayCtx.save(); overlayCtx.strokeStyle='rgba(120,140,255,.25)'; overlayCtx.lineWidth=1;
    for(let x=0;x<=DOC.w;x+=step){overlayCtx.beginPath(); overlayCtx.moveTo(x,0); overlayCtx.lineTo(x,DOC.h); overlayCtx.stroke();}
    for(let y=0;y<=DOC.h;y+=step){overlayCtx.beginPath(); overlayCtx.moveTo(0,y); overlayCtx.lineTo(DOC.w,y); overlayCtx.stroke();}
    overlayCtx.restore();

  if(state.guides.v.length || state.guides.h.length){
    overlayCtx.save(); overlayCtx.strokeStyle='rgba(90,210,190,.85)'; overlayCtx.lineWidth=1; overlayCtx.setLineDash([5,4]);
    state.guides.v.forEach(x=>{ overlayCtx.beginPath(); overlayCtx.moveTo(x,0); overlayCtx.lineTo(x,DOC.h); overlayCtx.stroke(); });
    state.guides.h.forEach(y=>{ overlayCtx.beginPath(); overlayCtx.moveTo(0,y); overlayCtx.lineTo(DOC.w,y); overlayCtx.stroke(); });
    overlayCtx.restore();

function drawStaticOverlay(){

function drawBrushCursor(pos){
  if(state.tool==='heal') drawHealMarker(pos);
  if(!['brush','pencil','eraser','spray','smudge','liquify','dodge','heal'].includes(state.tool)) return;
  const r=Math.max(1,state.size/2);
  const sq=state.tipShape==='square' && ['brush','pencil','eraser'].includes(state.tool);
  const shape=()=>{ overlayCtx.beginPath(); if(sq) overlayCtx.rect(pos.x-r,pos.y-r,r*2,r*2); else overlayCtx.arc(pos.x,pos.y,r,0,Math.PI*2); };
  overlayCtx.save();
  shape(); overlayCtx.strokeStyle='rgba(255,255,255,.9)'; overlayCtx.lineWidth=2.4; overlayCtx.stroke();
  shape(); overlayCtx.strokeStyle='rgba(0,0,0,.75)'; overlayCtx.lineWidth=1; overlayCtx.stroke();
  overlayCtx.restore();
}
function redrawOverlayWhileDrawing(pos){

let shapeStart=null, pendingShapeEnd=null;

let tempMoveCanvas=null, moveStart=null;
const SHAPE_TOOLS=['line','rect','roundrect','ellipse','triangle','star','arrow'];
const SIZE_PRESETS=[2,5,10,18,28,42,60,90,140];

function getPos(e){
  const rect=overlayCanvas.getBoundingClientRect();

function midpoint(a,b){return {x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
function getSymmetryBranches(){
  const w=DOC.w,h=DOC.h;
  if(state.symmetry==='vertical') return [p=>p, p=>({x:w-p.x,y:p.y})];
  if(state.symmetry==='horizontal') return [p=>p, p=>({x:p.x,y:h-p.y})];
  if(state.symmetry==='both') return [p=>p, p=>({x:w-p.x,y:p.y}), p=>({x:p.x,y:h-p.y}), p=>({x:w-p.x,y:h-p.y})];

function smoothPoint(branch,raw){

/* ===================== PUNTA CUADRADA / REDONDA ===================== */
function sqHull(a,b,h){
  const pts=[];
  [a,b].forEach(q=>{ pts.push([q.x-h,q.y-h],[q.x+h,q.y-h],[q.x+h,q.y+h],[q.x-h,q.y+h]); });
  pts.sort((u,v)=>u[0]-v[0]||u[1]-v[1]);
  const cross=(o,a2,b2)=>(a2[0]-o[0])*(b2[1]-o[1])-(a2[1]-o[1])*(b2[0]-o[0]);
  const lower=[]; for(const q of pts){ while(lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],q)<=0) lower.pop(); lower.push(q); }
  const upper=[]; for(let i=pts.length-1;i>=0;i--){ const q=pts[i]; while(upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],q)<=0) upper.pop(); upper.push(q); }
  upper.pop(); lower.pop();
  return lower.concat(upper);
}
/* Rellena, en una sola operación, el recorrido de un cuadrado (sin girar) por una lista de puntos */
function fillSquareSweep(ctx,points,size){
  const h=Math.max(0.5,size/2);
  ctx.beginPath();
  if(points.length===1){ ctx.rect(points[0].x-h,points[0].y-h,h*2,h*2); }
  for(let i=0;i<points.length-1;i++){
    const hull=sqHull(points[i],points[i+1],h);
    ctx.moveTo(hull[0][0],hull[0][1]);
    for(let k=1;k<hull.length;k++) ctx.lineTo(hull[k][0],hull[k][1]);
    ctx.closePath();
  }
  ctx.fill();
}
function quadPoints(p0,p1,p2,size){
  const len=Math.hypot(p1.x-p0.x,p1.y-p0.y)+Math.hypot(p2.x-p1.x,p2.y-p1.y);
  const n=Math.max(1,Math.min(60,Math.ceil(len/Math.max(2,size*0.5))));
  const out=[];
  for(let i=0;i<=n;i++){
    const t=i/n, mt=1-t;
    out.push({x:mt*mt*p0.x+2*mt*t*p1.x+t*t*p2.x, y:mt*mt*p0.y+2*mt*t*p1.y+t*t*p2.y});
  }
  return out;
}
function tipStroke(ctx,p0,p1,p2,width){
  if(state.tipShape==='square'){
    ctx.fillStyle=ctx.strokeStyle;
    fillSquareSweep(ctx,quadPoints(p0,p1,p2,width),width);
  } else {
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.quadraticCurveTo(p1.x,p1.y,p2.x,p2.y); ctx.stroke();
  }
}
function strokeSegmentOnLayer(p0,p1,p2,pressureFactor){
  const layer=layers[activeLayerIndex];
  const ctx=state.wetBrush && !isEraser_wet() ? wetCtx : layer.ctx;
  const isEraser=state.tool==='eraser';
  const isPencil=state.tool==='pencil';
  let size=state.size*(state.pressureEnabled?pressureFactor:1);
  size=Math.max(0.5,size);
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  const useWet=state.wetBrush && !isEraser;
  ctx.globalCompositeOperation=isEraser?'destination-out':'source-over';
  ctx.strokeStyle=state.color;
  if(!isEraser && state.tool==='brush' && state.hardness<0.95){
    ctx.globalAlpha=(useWet?1:state.opacity)*0.32*(1-state.hardness);
    ctx.lineWidth=size*1.7;
    tipStroke(ctx,p0,p1,p2,size*1.7);
  }
  ctx.globalAlpha=isEraser?1:(useWet?1:state.opacity);
  ctx.lineWidth=size;
  tipStroke(ctx,p0,p1,p2,size);
  if(!isEraser && isPencil && state.pencilTexture>0){
    ctx.globalAlpha=(useWet?1:state.opacity)*0.22*state.pencilTexture;
    ctx.lineWidth=Math.max(0.6,size*0.45);
    const j=()=> (Math.random()-0.5)*size*0.35*state.pencilTexture;
    ctx.beginPath();
    ctx.moveTo(p0.x+j(),p0.y+j());
    ctx.quadraticCurveTo(p1.x+j(),p1.y+j(),p2.x+j(),p2.y+j());
    ctx.stroke();
  }
  if(!isEraser && state.tool==='brush' && state.paperTexture>0){
    const grainCount=Math.round(2+state.paperTexture*6);
    for(let i=0;i<grainCount;i++){
      const t=Math.random();
      const mt=1-t;
      const px=mt*mt*p0.x+2*mt*t*p1.x+t*t*p2.x;
      const py=mt*mt*p0.y+2*mt*t*p1.y+t*t*p2.y;
      const jx=(Math.random()-0.5)*size*0.9, jy=(Math.random()-0.5)*size*0.9;
      const r=Math.max(0.4, size*0.06*Math.random());
      ctx.beginPath(); ctx.arc(px+jx,py+jy,r,0,Math.PI*2);
      if(Math.random()<0.5){
        ctx.globalCompositeOperation='destination-out';
        ctx.globalAlpha=state.paperTexture*0.35*Math.random();
        ctx.fillStyle='#000';
      } else {
        ctx.globalCompositeOperation='source-over';
        ctx.globalAlpha=state.opacity*state.paperTexture*0.3*Math.random();
        ctx.fillStyle=state.color;

      ctx.fill();

  }

}
function isEraser_wet(){ return state.tool==='eraser'; }
function drawDotOnLayer(p,pressureFactor){

  if(!isEraser && !state.wetBrush) ctx.globalAlpha=state.opacity;

/* ===================== AERÓGRAFO ===================== */
function sprayDab(){
  if(!sprayPos) return;
  const layer=layers[activeLayerIndex];
  const ctx=layer.ctx;
  const radius=state.size/2;
  const count=Math.round(state.density*0.9)+3;
  ctx.save();
  ctx.fillStyle=state.color;
  ctx.globalAlpha=state.opacity*0.55;
  for(let i=0;i<count;i++){
    const ang=Math.random()*Math.PI*2;
    const dist=Math.random()*radius;
    const px=sprayPos.x+Math.cos(ang)*dist, py=sprayPos.y+Math.sin(ang)*dist;
    const dotR=Math.max(0.4,radius*0.045*(0.5+Math.random()));

  }

/* ===================== DIFUMINAR (smudge) ===================== */
function smudgeStep(from,to){
  const layer=layers[activeLayerIndex];
  const ctx=layer.ctx;
  const s=Math.max(4,Math.round(state.size));
  let sx=Math.round(from.x-s/2), sy=Math.round(from.y-s/2);
  let sw=s, sh=s;
  if(sx<0){ sw+=sx; sx=0; }
  if(sy<0){ sh+=sy; sy=0; }
  if(sx+sw>DOC.w) sw=DOC.w-sx;
  if(sy+sh>DOC.h) sh=DOC.h-sy;
  if(sw<=1||sh<=1) return;
  let patch;
  try{ patch=ctx.getImageData(sx,sy,sw,sh); }catch(err){ return; }
  const tmp=document.createElement('canvas'); tmp.width=sw; tmp.height=sh;
  tmp.getContext('2d').putImageData(patch,0,0);
  const dx=to.x-from.x, dy=to.y-from.y;
  ctx.save();
  ctx.globalAlpha=state.smudgeStrength;
  ctx.drawImage(tmp, sx+dx, sy+dy);
  ctx.restore();
}

/* ===================== SELECCIÓN RECTANGULAR ===================== */
function makeRectSelection(x,y,w,h){
  x=Math.round(clamp(x,0,DOC.w)); y=Math.round(clamp(y,0,DOC.h));
  w=Math.round(clamp(w,0,DOC.w-x)); h=Math.round(clamp(h,0,DOC.h-y));
  if(w<1||h<1) return null;
  const mask=document.createElement('canvas'); mask.width=w; mask.height=h;
  const mctx=mask.getContext('2d'); mctx.fillStyle='#fff'; mctx.fillRect(0,0,w,h);
  return {x,y,w,h,mask};
}
function makeLassoSelection(points){
  if(points.length<3) return null;
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  points.forEach(p=>{ minX=Math.min(minX,p.x); minY=Math.min(minY,p.y); maxX=Math.max(maxX,p.x); maxY=Math.max(maxY,p.y); });
  minX=clamp(minX,0,DOC.w); minY=clamp(minY,0,DOC.h); maxX=clamp(maxX,0,DOC.w); maxY=clamp(maxY,0,DOC.h);
  const w=Math.round(maxX-minX), h=Math.round(maxY-minY);
  if(w<1||h<1) return null;
  const mask=document.createElement('canvas'); mask.width=w; mask.height=h;
  const mctx=mask.getContext('2d');
  mctx.fillStyle='#fff'; mctx.beginPath();
  mctx.moveTo(points[0].x-minX, points[0].y-minY);
  for(let i=1;i<points.length;i++) mctx.lineTo(points[i].x-minX, points[i].y-minY);
  mctx.closePath(); mctx.fill();
  return {x:Math.round(minX),y:Math.round(minY),w,h,mask};
}
function makeMagicWandSelection(startX,startY,tolerance){
  startX=Math.floor(startX); startY=Math.floor(startY);
  const w=DOC.w,h=DOC.h;
  if(startX<0||startY<0||startX>=w||startY>=h) return null;
  const ctx=layers[activeLayerIndex].ctx;
  const imgData=ctx.getImageData(0,0,w,h);
  const data=imgData.data;
  const idx=(startY*w+startX)*4;
  const tR=data[idx],tG=data[idx+1],tB=data[idx+2],tA=data[idx+3];
  const tol=tolerance;
  const visited=new Uint8Array(w*h);
  const stack=[startX,startY];
  let minX=startX,minY=startY,maxX=startX,maxY=startY;
  while(stack.length){
    const y=stack.pop(), x=stack.pop();
    if(x<0||x>=w||y<0||y>=h) continue;
    const p=y*w+x;
    if(visited[p]) continue;
    const i=p*4;
    const dr=data[i]-tR, dg=data[i+1]-tG, db=data[i+2]-tB, da=data[i+3]-tA;
    if((dr*dr+dg*dg+db*db+da*da) > tol*tol*4) continue;
    visited[p]=2;
    if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
    stack.push(x+1,y, x-1,y, x,y+1, x,y-1);
  }
  const bw=maxX-minX+1, bh=maxY-minY+1;
  if(bw<1||bh<1) return null;
  const mask=document.createElement('canvas'); mask.width=bw; mask.height=bh;
  const mctx=mask.getContext('2d');
  const maskData=mctx.createImageData(bw,bh);
  for(let yy=0;yy<bh;yy++){
    for(let xx=0;xx<bw;xx++){
      const srcP=(minY+yy)*w+(minX+xx);
      if(visited[srcP]===2){
        const di=(yy*bw+xx)*4;
        maskData.data[di]=255; maskData.data[di+1]=255; maskData.data[di+2]=255; maskData.data[di+3]=255;
      }
    }
  }
  mctx.putImageData(maskData,0,0);
  return {x:minX,y:minY,w:bw,h:bh,mask};
}
function drawSelectionOverlay(){

function clearSelectionContents(){

function cropToSelection(){

/* Aplica un canvas "resultado" (mismo tamaño que r) sobre la capa en la región r,
   respetando la máscara de selección si existe (si no hay selección, se pega directo) */
function compositeRegionBack(ctx,r,resultCanvas){
  if(state.selection){
    const sel=state.selection;
    const overlapX=Math.max(r.x,sel.x), overlapY=Math.max(r.y,sel.y);
    const overlapR=Math.min(r.x+r.w,sel.x+sel.w), overlapB=Math.min(r.y+r.h,sel.y+sel.h);
    if(overlapR<=overlapX || overlapB<=overlapY) return;
    const tmp=document.createElement('canvas'); tmp.width=r.w; tmp.height=r.h;
    const tctx=tmp.getContext('2d');
    tctx.drawImage(resultCanvas,0,0);
    tctx.globalCompositeOperation='destination-in';
    tctx.drawImage(sel.mask, sel.x-r.x, sel.y-r.y);
    ctx.drawImage(tmp,r.x,r.y);
  } else {
    ctx.clearRect(r.x,r.y,r.w,r.h);
    ctx.drawImage(resultCanvas,r.x,r.y);
  }
}

/* ===================== FORMAS ===================== */
function currentStyle(){return {color:state.color,size:state.size,opacity:state.opacity,fillShape:state.fillShape,tip:state.tipShape};}
function hexToRgba(hex,alpha){ const rgb=hexToRgb(hex); return 'rgba('+rgb.r+','+rgb.g+','+rgb.b+','+alpha+')'; }
function applyGradient(p0,p1){
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const layer=layers[activeLayerIndex];
  const r=state.selection?{x:state.selection.x,y:state.selection.y,w:state.selection.w,h:state.selection.h}:{x:0,y:0,w:DOC.w,h:DOC.h};
  const tmp=document.createElement('canvas'); tmp.width=r.w; tmp.height=r.h;
  const tctx=tmp.getContext('2d');
  let grad;
  const rp0={x:p0.x-r.x,y:p0.y-r.y}, rp1={x:p1.x-r.x,y:p1.y-r.y};
  if(state.gradientType==='radial'){
    const rad=Math.max(1,Math.hypot(rp1.x-rp0.x,rp1.y-rp0.y));
    grad=tctx.createRadialGradient(rp0.x,rp0.y,0,rp0.x,rp0.y,rad);
  } else {
    grad=tctx.createLinearGradient(rp0.x,rp0.y,rp1.x,rp1.y);
  }
  const stopStart=state.color;
  const stopEnd=state.gradientFade?hexToRgba(state.color,0):state.gradientColor2;
  grad.addColorStop(0,stopStart);
  grad.addColorStop(1,stopEnd);
  tctx.globalAlpha=state.opacity;
  tctx.fillStyle=grad;
  tctx.fillRect(0,0,r.w,r.h);

  composite(); updateActiveThumbnail(); addRecentColor(state.color);

function renderShape(ctx,tool,start,end,style){
  ctx.save();
  ctx.strokeStyle=style.color; ctx.fillStyle=style.color; ctx.lineWidth=style.size;
  ctx.globalAlpha=style.opacity; ctx.lineCap='round'; ctx.lineJoin='round';
  if(tool==='line'){
    if(style.tip==='square') fillSquareSweep(ctx,[start,end],style.size);
    else { ctx.beginPath(); ctx.moveTo(start.x,start.y); ctx.lineTo(end.x,end.y); ctx.stroke(); }
  }
  else if(tool==='rect'){
    const x=Math.min(start.x,end.x), y=Math.min(start.y,end.y), w=Math.abs(end.x-start.x), h=Math.abs(end.y-start.y);
    if(style.fillShape) ctx.fillRect(x,y,w,h); else ctx.strokeRect(x,y,w,h);
  } else if(tool==='ellipse'){
    const cx=(start.x+end.x)/2, cy=(start.y+end.y)/2, rx=Math.abs(end.x-start.x)/2, ry=Math.abs(end.y-start.y)/2;
    ctx.beginPath(); ctx.ellipse(cx,cy,Math.max(rx,0.1),Math.max(ry,0.1),0,0,Math.PI*2);
    if(style.fillShape) ctx.fill(); else ctx.stroke();
  } else if(tool==='arrow'){
    ctx.beginPath(); ctx.moveTo(start.x,start.y); ctx.lineTo(end.x,end.y); ctx.stroke();
    const angle=Math.atan2(end.y-start.y,end.x-start.x);
    const headLen=Math.max(14,style.size*2.4);
    ctx.beginPath(); ctx.moveTo(end.x,end.y);
    ctx.lineTo(end.x-headLen*Math.cos(angle-Math.PI/7), end.y-headLen*Math.sin(angle-Math.PI/7));
    ctx.lineTo(end.x-headLen*Math.cos(angle+Math.PI/7), end.y-headLen*Math.sin(angle+Math.PI/7));
    ctx.closePath(); ctx.fill();
  } else if(tool==='roundrect'){
    const x=Math.min(start.x,end.x), y=Math.min(start.y,end.y), w=Math.abs(end.x-start.x), h=Math.abs(end.y-start.y);
    const r=Math.min(state.cornerRadius, w/2, h/2);
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    if(style.fillShape) ctx.fill(); else ctx.stroke();
  } else if(tool==='triangle'){
    const x=Math.min(start.x,end.x), y=Math.min(start.y,end.y), w=Math.abs(end.x-start.x), h=Math.abs(end.y-start.y);
    ctx.beginPath();
    ctx.moveTo(x+w/2,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath();
    if(style.fillShape) ctx.fill(); else ctx.stroke();
  } else if(tool==='star'){
    const cx=(start.x+end.x)/2, cy=(start.y+end.y)/2;
    const rOuter=Math.max(4,Math.hypot(end.x-start.x,end.y-start.y)/2);
    const rInner=rOuter*0.42;
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const ang=(Math.PI/5)*i - Math.PI/2;
      const rad=i%2===0?rOuter:rInner;
      const px=cx+rad*Math.cos(ang), py=cy+rad*Math.sin(ang);
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath();
    if(style.fillShape) ctx.fill(); else ctx.stroke();
  }
  ctx.restore();
}
function constrainShape(tool,start,pos){
  if(tool==='rect'||tool==='ellipse'||tool==='roundrect'||tool==='triangle'||tool==='star'){
    const dx=pos.x-start.x, dy=pos.y-start.y;
    const d=Math.max(Math.abs(dx),Math.abs(dy));
    return {x:start.x+(dx<0?-d:d), y:start.y+(dy<0?-d:d)};
  }
  const dx=pos.x-start.x, dy=pos.y-start.y;
  const dist=Math.hypot(dx,dy);
  let angle=Math.atan2(dy,dx);
  const step=Math.PI/12;
  angle=Math.round(angle/step)*step;
  return {x:start.x+dist*Math.cos(angle), y:start.y+dist*Math.sin(angle)};
}
function drawPolygonPreview(hover){

  for(let i=1;i<polygonPoints.length;i++) overlayCtx.lineTo(polygonPoints[i].x,polygonPoints[i].y);
  if(hover) overlayCtx.lineTo(hover.x,hover.y);

}
function finalizePolygon(){

/* ===================== SOBREEXPONER / SUBEXPONER ===================== */
function dodgeBurnDab(cx,cy,invert){
  const ctx=layers[activeLayerIndex].ctx;
  const r=Math.max(2,state.size/2);
  const x0=Math.max(0,Math.floor(cx-r)), y0=Math.max(0,Math.floor(cy-r));
  const x1=Math.min(DOC.w,Math.ceil(cx+r)), y1=Math.min(DOC.h,Math.ceil(cy+r));
  const w=x1-x0, h=y1-y0; if(w<=0||h<=0) return;
  let img; try{ img=ctx.getImageData(x0,y0,w,h); }catch(err){ return; }
  const d=img.data;
  const burn=(state.dbMode==='burn')!==!!invert;
  const k=state.dbExposure/100*0.18;
  const range=state.dbRange;
  for(let y=0;y<h;y++){
    for(let x=0;x<w;x++){
      const i=(y*w+x)*4;
      if(d[i+3]===0) continue;
      const dist=Math.hypot(x0+x+0.5-cx,y0+y+0.5-cy)/r;
      if(dist>=1) continue;
      const fall=1-dist*dist;
      const lum=(0.299*d[i]+0.587*d[i+1]+0.114*d[i+2])/255;
      let wgt;
      if(range==='shadows') wgt=Math.max(0.05,1-lum*1.6);
      else if(range==='high') wgt=Math.max(0.05,lum*1.6-0.6);
      else wgt=Math.max(0.1,1-Math.abs(lum-0.5)*2);
      const amt=k*fall*wgt;
      for(let c=0;c<3;c++){
        const v=d[i+c];
        d[i+c]=burn? v*(1-amt) : v+(255-v)*amt;
      }
    }
  }
  ctx.putImageData(img,x0,y0);
}
function dodgeBurnStep(from,to,invert){
  const dist=Math.hypot(to.x-from.x,to.y-from.y);
  const spacing=Math.max(2,state.size*0.18);
  const n=Math.max(1,Math.ceil(dist/spacing));
  for(let i=1;i<=n;i++){ const t=i/n; dodgeBurnDab(from.x+(to.x-from.x)*t, from.y+(to.y-from.y)*t, invert); }
}
let dodgeInvert=false;

/* ===================== CORRECTOR (HEALING) ===================== */
function healLowPass(img,s){
  const c=document.createElement('canvas'); c.width=s; c.height=s; c.getContext('2d').putImageData(img,0,0);
  const k=Math.max(2,Math.round(s/8));
  const sm=document.createElement('canvas'); sm.width=k; sm.height=k;
  const sc=sm.getContext('2d'); sc.imageSmoothingEnabled=true; sc.drawImage(c,0,0,k,k);
  const bg=document.createElement('canvas'); bg.width=s; bg.height=s;
  const bc=bg.getContext('2d'); bc.imageSmoothingEnabled=true; bc.imageSmoothingQuality='high'; bc.drawImage(sm,0,0,s,s);
  return bc.getImageData(0,0,s,s);
}
function healDab(cx,cy){
  const ctx=layers[activeLayerIndex].ctx;
  const r=Math.max(3,state.size/2);
  const s=Math.max(6,Math.ceil(r*2));
  const x0=Math.round(cx-s/2), y0=Math.round(cy-s/2);
  const sx0=Math.round(cx+healOffset.x-s/2), sy0=Math.round(cy+healOffset.y-s/2);
  let dst,src; try{ dst=ctx.getImageData(x0,y0,s,s); src=ctx.getImageData(sx0,sy0,s,s); }catch(err){ return; }
  const dl=healLowPass(dst,s), sl=healLowPass(src,s);
  const out=new ImageData(s,s);
  const o=out.data, D=dst.data, S=src.data, DL=dl.data, SL=sl.data;
  for(let i=0;i<o.length;i+=4){
    const sa=S[i+3], da=D[i+3];
    if(sa===0 && da===0) continue;
    if(da===0){ o[i]=S[i]; o[i+1]=S[i+1]; o[i+2]=S[i+2]; o[i+3]=sa; continue; }
    for(let c=0;c<3;c++){
      const v=DL[i+c]+(S[i+c]-SL[i+c]);
      o[i+c]=v<0?0:(v>255?255:v);
    }
    o[i+3]=da;
  }
  const t=document.createElement('canvas'); t.width=s; t.height=s;
  const tc=t.getContext('2d'); tc.putImageData(out,0,0);
  applyRadialFeather(tc,s,s);
  ctx.save(); ctx.globalAlpha=Math.min(1,state.healStrength/100*0.7); ctx.drawImage(t,x0,y0); ctx.restore();
}
function healStep(from,to){
  const dist=Math.hypot(to.x-from.x,to.y-from.y);
  const spacing=Math.max(3,state.size*0.22);
  const n=Math.max(1,Math.ceil(dist/spacing));
  for(let i=1;i<=n;i++){ const t=i/n; healDab(from.x+(to.x-from.x)*t, from.y+(to.y-from.y)*t); }
}
function drawHealMarker(pos){
  let p=null;
  if(isStrokeActive && healOffset) p={x:pos.x+healOffset.x,y:pos.y+healOffset.y};
  else if(healSource) p=healSource;
  if(!p) return;
  overlayCtx.save();
  overlayCtx.strokeStyle='#4a90d9'; overlayCtx.lineWidth=2;
  overlayCtx.beginPath(); overlayCtx.arc(p.x,p.y,Math.max(4,state.size/2),0,Math.PI*2); overlayCtx.stroke();
  overlayCtx.beginPath(); overlayCtx.moveTo(p.x-9,p.y); overlayCtx.lineTo(p.x+9,p.y); overlayCtx.moveTo(p.x,p.y-9); overlayCtx.lineTo(p.x,p.y+9); overlayCtx.stroke();
  overlayCtx.restore();
}

/* ===================== PLUMA BÉZIER ===================== */
const BZ_HIT=12;
function bzPath(ctx,nodes,closed){
  ctx.beginPath();
  ctx.moveTo(nodes[0].x,nodes[0].y);
  const seg=(a,b)=>ctx.bezierCurveTo(a.x+a.ox,a.y+a.oy,b.x+b.ix,b.y+b.iy,b.x,b.y);
  for(let i=1;i<nodes.length;i++) seg(nodes[i-1],nodes[i]);
  if(closed){ seg(nodes[nodes.length-1],nodes[0]); ctx.closePath(); }
}
function bzHit(pos){
  for(let k=bezierNodes.length-1;k>=0;k--){
    const n=bezierNodes[k];
    if(Math.hypot(n.ox,n.oy)>0.5 || Math.hypot(n.ix,n.iy)>0.5){
      if(Math.hypot(pos.x-(n.x+n.ox),pos.y-(n.y+n.oy))<=BZ_HIT) return {type:'out',i:k};
      if(Math.hypot(pos.x-(n.x+n.ix),pos.y-(n.y+n.iy))<=BZ_HIT) return {type:'in',i:k};
    }
  }
  for(let k=bezierNodes.length-1;k>=0;k--){
    const n=bezierNodes[k];
    if(Math.hypot(pos.x-n.x,pos.y-n.y)<=BZ_HIT) return {type:'node',i:k};
  }
  return null;
}
function drawBezierOverlay(hover){
  bezierHover=hover||null;
  overlayCtx.clearRect(0,0,DOC.w,DOC.h);
  drawGridAndGuides();
  const nodes=bezierNodes; if(!nodes.length) return;
  const ctx=overlayCtx;
  ctx.save();
  const snapClose=!!(hover && nodes.length>=3 && !bezierDrag && Math.hypot(hover.x-nodes[0].x,hover.y-nodes[0].y)<=BZ_HIT);
  const preview=nodes.slice();
  if(hover && !bezierDrag && !snapClose) preview.push({x:hover.x,y:hover.y,ix:0,iy:0,ox:0,oy:0});
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(preview.length>=2){
    if(state.bzFill && preview.length>=3){
      bzPath(ctx,preview,true); ctx.fillStyle=state.bzFillColor; ctx.globalAlpha=0.35; ctx.fill(); ctx.globalAlpha=1;
    }
    bzPath(ctx,preview,snapClose);
    ctx.globalAlpha=0.9; ctx.strokeStyle=state.color; ctx.lineWidth=Math.max(1,state.size); ctx.stroke(); ctx.globalAlpha=1;
  }
  nodes.forEach((n,k)=>{
    if(Math.hypot(n.ox,n.oy)>0.5 || Math.hypot(n.ix,n.iy)>0.5){
      ctx.strokeStyle='rgba(74,144,217,.9)'; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(n.x+n.ix,n.y+n.iy); ctx.lineTo(n.x,n.y); ctx.lineTo(n.x+n.ox,n.y+n.oy); ctx.stroke();
      [[n.ix,n.iy],[n.ox,n.oy]].forEach(([hx,hy])=>{
        ctx.beginPath(); ctx.arc(n.x+hx,n.y+hy,4.5,0,Math.PI*2);
        ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#4a90d9'; ctx.lineWidth=1.4; ctx.stroke();
      });
    }
    ctx.beginPath(); ctx.rect(n.x-5,n.y-5,10,10);
    ctx.fillStyle=(k===0)?(snapClose?'#5cc28a':'#e2a34d'):'#fff';
    ctx.fill(); ctx.strokeStyle='#141519'; ctx.lineWidth=1.5; ctx.stroke();
  });
  if(snapClose){
    const p0=nodes[0];
    ctx.beginPath(); ctx.arc(p0.x,p0.y,BZ_HIT+6,0,Math.PI*2);
    ctx.strokeStyle='#5cc28a'; ctx.lineWidth=2; ctx.setLineDash([4,3]); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#5cc28a'; ctx.font='bold 12px Kalam,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText('Cerrar curva',p0.x,p0.y-BZ_HIT-10);
  }
  ctx.restore();
}
function bzDown(pos,e){
  const hit=bzHit(pos);
  if(hit){
    const n=bezierNodes[hit.i];
    if(hit.type==='node' && e.altKey){ n.ix=n.iy=n.ox=n.oy=0; drawBezierOverlay(pos); return; }
    bezierDrag={type:hit.type,i:hit.i,start:pos,moved:false,orig:{x:n.x,y:n.y}};
  } else {
    bezierNodes.push({x:pos.x,y:pos.y,ix:0,iy:0,ox:0,oy:0});
    bezierDrag={type:'new',i:bezierNodes.length-1,start:pos,moved:false,orig:{x:pos.x,y:pos.y}};
  }
  drawBezierOverlay(pos);
}
function bzMove(pos,e){
  if(!bezierDrag){ drawBezierOverlay(pos); return; }
  const d=bezierDrag, n=bezierNodes[d.i];
  if(Math.hypot(pos.x-d.start.x,pos.y-d.start.y)>3) d.moved=true;
  if(d.type==='node'){
    if(d.moved){ n.x=d.orig.x+(pos.x-d.start.x); n.y=d.orig.y+(pos.y-d.start.y); }
  } else if(d.type==='new' || d.type==='out'){
    n.ox=pos.x-n.x; n.oy=pos.y-n.y;
    if(!e.altKey || d.type==='new'){ n.ix=-n.ox; n.iy=-n.oy; }
  } else if(d.type==='in'){
    n.ix=pos.x-n.x; n.iy=pos.y-n.y;
    if(!e.altKey){ n.ox=-n.ix; n.oy=-n.iy; }
  }
  drawBezierOverlay(pos);
}
function bzUp(){
  const d=bezierDrag; bezierDrag=null;
  if(!d) return;
  if(d.type==='node' && d.i===0 && !d.moved && bezierNodes.length>=3){ commitBezier(true); return; }
  drawBezierOverlay(bezierHover);
}
function commitBezier(closed){
  if(bezierNodes.length<2){ toast('Pon al menos 2 nodos'); return; }
  if(layers[activeLayerIndex].locked){ toast('Esta capa está bloqueada'); return; }
  pushUndo();
  const tmp=document.createElement('canvas'); tmp.width=DOC.w; tmp.height=DOC.h;
  const t=tmp.getContext('2d'); t.lineCap='round'; t.lineJoin='round';
  bzPath(t,bezierNodes,closed);
  if(state.bzFill && bezierNodes.length>=3){ t.fillStyle=state.bzFillColor; t.fill(); }
  if(state.bzStroke || !state.bzFill){ t.strokeStyle=state.color; t.lineWidth=state.size; t.stroke(); }
  const ctx=layers[activeLayerIndex].ctx;
  ctx.save(); ctx.globalAlpha=state.opacity; ctx.drawImage(tmp,0,0); ctx.restore();
  bezierNodes=[]; bezierDrag=null; bezierHover=null;
  overlayCtx.clearRect(0,0,DOC.w,DOC.h); drawGridAndGuides();
  composite(); updateActiveThumbnail(); addRecentColor(state.color);
}
function cancelBezier(){
  bezierNodes=[]; bezierDrag=null; bezierHover=null;
  overlayCtx.clearRect(0,0,DOC.w,DOC.h); drawGridAndGuides();
}

/* ===================== FORMA LIBRE (compás de vértices) ===================== */
const FF_SNAP_RADIUS=22; // px en coordenadas de documento
function ffSnapToFirst(hover){
  if(!hover || freeformPoints.length<3) return false;
  const p0=freeformPoints[0];
  return Math.hypot(hover.x-p0.x, hover.y-p0.y) <= FF_SNAP_RADIUS;
}
function drawFreeformPreview(hover){
  overlayCtx.clearRect(0,0,DOC.w,DOC.h);
  if(!freeformPoints.length) return;
  const pts=freeformPoints;
  const snap=ffSnapToFirst(hover);
  const cursorPt=snap?pts[0]:hover;
  overlayCtx.save();

  // --- relleno de preview ---
  if(state.ffFill && pts.length>=2){
    overlayCtx.beginPath();
    overlayCtx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++) overlayCtx.lineTo(pts[i].x,pts[i].y);
    if(cursorPt && !snap) overlayCtx.lineTo(cursorPt.x,cursorPt.y);
    overlayCtx.closePath();
    overlayCtx.fillStyle=state.ffFillColor||'#4a90d9';
    overlayCtx.globalAlpha=(state.opacity||1)*0.35;
    overlayCtx.fill();
    overlayCtx.globalAlpha=1;
  }

  // --- contorno ---
  overlayCtx.strokeStyle=state.ffNoBorder?'transparent':(state.ffStrokeColor||state.color);
  overlayCtx.lineWidth=Math.max(1,state.size);
  overlayCtx.lineCap='round'; overlayCtx.lineJoin='round';
  overlayCtx.setLineDash([7,5]);
  overlayCtx.beginPath();
  overlayCtx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) overlayCtx.lineTo(pts[i].x,pts[i].y);
  if(cursorPt) overlayCtx.lineTo(cursorPt.x,cursorPt.y);
  if(pts.length>=2) overlayCtx.lineTo(pts[0].x,pts[0].y);
  overlayCtx.stroke();
  overlayCtx.setLineDash([]);

  // --- vértices ---
  pts.forEach((p,i)=>{
    const isFirst=i===0;
    overlayCtx.beginPath();
    overlayCtx.arc(p.x,p.y, isFirst?9:6, 0,Math.PI*2);
    overlayCtx.fillStyle=isFirst?(snap?'#5cc28a':(state.ffFillColor||'#4a90d9')):'#e2a34d';
    overlayCtx.fill();
    overlayCtx.strokeStyle='#141519'; overlayCtx.lineWidth=1.5; overlayCtx.stroke();
    overlayCtx.fillStyle='#fff';
    overlayCtx.font='bold 9px IBM Plex Mono';
    overlayCtx.textAlign='center'; overlayCtx.textBaseline='middle';
    overlayCtx.fillText(i+1,p.x,p.y);
  });

  // --- indicador de cierre (snap) ---
  if(snap){
    const p0=pts[0];
    overlayCtx.beginPath();
    overlayCtx.arc(p0.x,p0.y, FF_SNAP_RADIUS, 0,Math.PI*2);
    overlayCtx.strokeStyle='#5cc28a';
    overlayCtx.lineWidth=2; overlayCtx.setLineDash([4,3]);
    overlayCtx.stroke(); overlayCtx.setLineDash([]);
    // texto
    overlayCtx.fillStyle='#5cc28a';
    overlayCtx.font='bold 12px Kalam,sans-serif';
    overlayCtx.textAlign='center'; overlayCtx.textBaseline='bottom';
    overlayCtx.fillText('Cerrar forma',p0.x,p0.y-FF_SNAP_RADIUS-4);
  }

  overlayCtx.restore();
}
function finalizeFreeform(){
  if(freeformPoints.length<3){ toast('Necesitas al menos 3 vértices'); return; }
  const ctx=layers[activeLayerIndex].ctx;
  ctx.save();
  ctx.globalAlpha=state.opacity||1;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(freeformPoints[0].x,freeformPoints[0].y);
  for(let i=1;i<freeformPoints.length;i++) ctx.lineTo(freeformPoints[i].x,freeformPoints[i].y);
  ctx.closePath();
  if(state.ffFill!==false){
    ctx.fillStyle=state.ffFillColor||'#4a90d9';
    ctx.fill();
  }
  if(!state.ffNoBorder){
    ctx.strokeStyle=state.ffStrokeColor||state.color;
    ctx.lineWidth=state.size;
    ctx.stroke();
  }
  ctx.restore();
  freeformPoints=[]; overlayCtx.clearRect(0,0,DOC.w,DOC.h);
  composite(); updateActiveThumbnail();
}

/* ===================== BOTE DE RELLENO ===================== */
function floodFill(ctx,startX,startY,fillHex,tolerance){
  startX=Math.floor(startX); startY=Math.floor(startY);
  const w=DOC.w,h=DOC.h;
  if(startX<0||startY<0||startX>=w||startY>=h) return;
  const imgData=ctx.getImageData(0,0,w,h);
  const data=imgData.data;
  const startIdx=(startY*w+startX)*4;
  const tR=data[startIdx],tG=data[startIdx+1],tB=data[startIdx+2],tA=data[startIdx+3];
  const fill=hexToRgb(fillHex);
  const fillA=Math.round(state.opacity*255);
  if(tR===fill.r&&tG===fill.g&&tB===fill.b&&tA===fillA) return;
  const tol=tolerance;
  const visited=new Uint8Array(w*h);
  const stack=[startX,startY];
  while(stack.length){
    const y=stack.pop(), x=stack.pop();
    if(x<0||x>=w||y<0||y>=h) continue;
    const p=y*w+x;
    if(visited[p]) continue;
    const i=p*4;
    const dr=data[i]-tR, dg=data[i+1]-tG, db=data[i+2]-tB, da=data[i+3]-tA;
    if((dr*dr+dg*dg+db*db+da*da) > tol*tol*4) continue;
    visited[p]=1;
    data[i]=fill.r; data[i+1]=fill.g; data[i+2]=fill.b; data[i+3]=fillA;
    stack.push(x+1,y, x-1,y, x,y+1, x,y-1);
  }
  ctx.putImageData(imgData,0,0);
}

/* ===================== TEXTO ===================== */
function openTextEditor(pos){
  const rect=overlayCanvas.getBoundingClientRect();
  const scale=rect.width/DOC.w;
  const box=document.createElement('div');
  box.className='text-edit-box'; box.contentEditable='true';
  box.style.left=(rect.left+pos.x*scale+window.scrollX)+'px';
  box.style.top=(rect.top+pos.y*scale-state.fontSize*scale*0.8+window.scrollY)+'px';
  box.style.font=(state.fontSize*scale)+'px '+(state.fontFamily||'Space Grotesk');
  box.style.color=state.color;
  document.body.appendChild(box);
  box.focus();
  function commit(){
    const text=box.innerText;
    box.remove();
    if(!text.trim()) return;
    pushUndo();
    const ctx=layers[activeLayerIndex].ctx;
    ctx.save();
    ctx.fillStyle=state.color; ctx.globalAlpha=state.opacity;
    ctx.font=state.fontSize+'px '+(state.fontFamily||'Space Grotesk');
    ctx.textBaseline='top';
    text.split('\n').forEach((line,i)=>ctx.fillText(line,pos.x,pos.y-state.fontSize*0.8+i*state.fontSize*1.2));
    ctx.restore();
    composite(); updateActiveThumbnail(); addRecentColor(state.color);
  }
  box.addEventListener('keydown',(e)=>{
    if(e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); commit(); }
    if(e.key==='Escape'){ e.preventDefault(); box.remove(); }
  });
  box.addEventListener('blur',commit);
}

/* ===================== EVENTOS DE PUNTERO ===================== */
function updateStatusBarCoords(pos){
  document.getElementById('statCoords').textContent='x: '+Math.round(pos.x)+', y: '+Math.round(pos.y);
}
function updateOverlayHover(pos){
  if(isStrokeActive) return;
